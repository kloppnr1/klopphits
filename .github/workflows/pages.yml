name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - claude/big-screen-controller-software-azo7r9
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Følg GitHubs officielle Pages-anbefaling: annullér IKKE igangvaerende
# deploys. cancel-in-progress: true kunne afbryde et upload-step midt i
# og efterlade to "github-pages"-artefakter, som deploy-pages saa naegter
# at vaelge imellem ("Multiple artifacts named github-pages ...").
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
