<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="KloppHits koncept-UI: controller-styret big screen-oplevelse til videoklip, Steam og retro-spil.">
<title>KloppHits – Koncept-UI</title>
</head>
<body>
<style>
  /* KloppHits koncept-UI — tvOS-inspireret fuldskaermsnavigation.
     Hver sektion fylder hele skaermen med et stemningsfuldt hero-baggrunds-
     billede der crossfader ved fokusskift. I den rigtige app er baggrundene
     dine egne billeder, videostills og Steam-covers.
     Identitet: biograf-sort, frosted glas, hvid typografi - farverne
     kommer fra indholdet. Fokus vises med loeft og lys, ikke ringe.
     1rem skalerer med skaermen, saa alt ser ens ud paa 1080p og 4K. */

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #050507;
    --glass: rgba(255, 255, 255, 0.07);
    --glass-strong: rgba(255, 255, 255, 0.12);
    --line: rgba(255, 255, 255, 0.14);
    --text: #f5f5f7;
    --text-dim: rgba(235, 235, 245, 0.62);
    --radius: 1.2rem;
    --safe-x: 5vw;
    --safe-y: 2.5vh;
    color-scheme: dark;
  }

  html {
    font-size: min(calc(100vh / 67.5), calc(100vw / 52));
    font-size: min(calc(100dvh / 67.5), calc(100vw / 52));
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: radial-gradient(90vw 65vh at 50% -15%, #101014 0%, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", "Helvetica Neue", sans-serif;
    user-select: none;
  }

  /* ---- Fuldskaerms hero-baggrund ---- */

  #ambient { position: fixed; inset: -3vw; z-index: 0; pointer-events: none; }
  #ambient .amb-layer {
    position: absolute; inset: 0;
    opacity: 0;
    transition: opacity 1.1s ease;
    animation: slowZoom 36s ease-in-out infinite alternate;
  }
  #ambient .amb-layer.visible { opacity: 1; }
  #ambient .amb-layer svg { width: 100%; height: 100%; display: block; }
  #ambient .amb-layer .hero-img {
    position: absolute; inset: 0;
    z-index: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  /* Art-visning til portraet-covers: hele vaerket centreret med skygge
     paa Commodore-brand-heroen (logo, regnbue-baand, ordmaerke) */

  /* Load-sekvens: C64 boot-skaerm som start-ritual naar A trykkes */
  #c64load {
    position: fixed; inset: 0; z-index: 2;
    background: rgba(6, 6, 8, 0.85);
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    transition: opacity 0.35s ease;
  }
  #c64load.on { opacity: 1; }
  #c64load .crt-tv { height: 64vh; }
  .c64-boot {
    position: absolute; inset: 0;
    background: #7869c4;
    padding: 2rem;
  }
  .c64-boot::after {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.1) 0 2px, transparent 2px 5px);
    pointer-events: none;
  }
  .c64-field {
    width: 100%; height: 100%;
    background: #40318d;
    padding: 1.6rem 2rem;
    overflow: hidden;
  }
  .c64-text {
    font-family: 'Courier New', 'Lucida Console', monospace;
    font-weight: 700;
    font-size: 1.85rem;
    line-height: 1.55;
    color: #7869c4;
    letter-spacing: 0.06em;
    white-space: pre-wrap;
    margin: 0;
  }
  .c64-cursor {
    display: inline-block;
    width: 1.05ch; height: 1.05em;
    background: #7869c4;
    vertical-align: text-bottom;
    animation: c64blink 1.06s steps(1) infinite;
  }
  @keyframes c64blink { 50% { opacity: 0; } }
  /* Ambient-laget er 3vw stoerre end skaermen (Ken Burns) - kompenser,
     saa coveret faar 5vh luft over og 9vh under i skaerm-koordinater */
  #ambient .amb-layer .art-fg {
    position: absolute;
    z-index: 1;
    top: calc(3vw + 5vh);
    left: 3vw;
    width: calc(100% - 6vw);
    height: calc(100% - 6vw - 14vh);
    object-fit: contain;
    filter: drop-shadow(0 1.5rem 3.5rem rgba(0, 0, 0, 0.7));
    transition: opacity 0.6s ease;
  }
  /* Coveret gemmes vaek, mens longplay-previewet koerer (medmindre keepArt) */
  #ambient .amb-layer .art-fg.skjult { opacity: 0; }
  /* Lille tekstbeskrivelse - bruges hvor cover + video vises samtidig */
  #ambient .amb-layer .amb-caption {
    position: absolute;
    z-index: 3;
    left: calc(3vw + var(--safe-x));
    bottom: calc(3vw + var(--safe-y) + 1rem);
    max-width: 32vw;
    text-shadow: 0 0.2rem 1rem rgba(0, 0, 0, 0.6);
  }
  #ambient .amb-layer .amb-caption .amb-caption-title {
    font-size: 2rem; font-weight: 700; letter-spacing: -0.01em; line-height: 1.1;
  }
  #ambient .amb-layer .amb-caption .amb-caption-sub {
    font-size: 1.1rem; color: rgba(235, 235, 245, 0.72); margin-top: 0.3rem;
  }
  #ambient .amb-layer video.hero-video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.8s ease;
    z-index: 2; /* altid over covers - de appendes asynkront efter videoen */
  }
  #ambient .amb-layer video.hero-video.on { opacity: 1; }
  /* Pixel-perfekt C64-rendering (testens vinder, tilstand 4):
     videoen tegnes paa canvas og opskaleres uden udjaevning */
  /* CRT-TV: haandtegnet fjernsynsramme om baade gameplay og load-skaerm.
     Lavoploeselige kilder vises i moderat stoerrelse - ikke fuld skaerm */
  .crt-tv {
    display: flex;
    align-items: stretch;
    padding: 1.3rem;
    background: linear-gradient(180deg, #2a2521 0%, #141110 100%);
    border-radius: 1.4rem;
    box-shadow: 0 3rem 7rem rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.06);
  }
  .crt-screen {
    position: relative;
    height: 100%;
    aspect-ratio: 4 / 3;
    background: #000;
    border-radius: 1.6rem;
    overflow: hidden;
    box-shadow: inset 0 0 3.5rem rgba(0, 0, 0, 0.85);
  }
  .crt-screen::after {
    content: '';
    position: absolute; inset: 0;
    border-radius: inherit;
    background: radial-gradient(120% 90% at 30% 12%, rgba(255, 255, 255, 0.07), transparent 45%);
    pointer-events: none;
    z-index: 3;
  }
  .crt-screen canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    image-rendering: pixelated;
  }
  .crt-panel {
    width: 5rem;
    margin-left: 1.1rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    padding: 0.8rem 0;
  }
  .crt-knob {
    position: relative;
    width: 2.7rem; height: 2.7rem;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #3c3630, #171411 70%);
    box-shadow: inset 0 0.15rem 0.35rem rgba(255, 255, 255, 0.08), 0 0.25rem 0.5rem rgba(0, 0, 0, 0.6);
  }
  .crt-knob::after {
    content: '';
    position: absolute;
    top: 12%; left: 50%;
    width: 0.28rem; height: 34%;
    transform: translateX(-50%);
    background: #0b0907;
    border-radius: 0.2rem;
  }
  .crt-knob-lille { width: 2rem; height: 2rem; }
  .crt-grille {
    flex: 1;
    width: 3.4rem;
    margin-top: 0.5rem;
    border-radius: 0.4rem;
    background: repeating-linear-gradient(0deg, #0d0b09 0 0.35rem, #201c18 0.35rem 0.75rem);
  }
  /* Gameplay-TV'et i ambient-laget */
  #ambient .amb-layer .crt-tv {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    height: 64vh;
    opacity: 0;
    transition: opacity 0.8s ease;
    z-index: 2;
  }
  #ambient .amb-layer .crt-tv.on { opacity: 1; }
  #ambient .amb-layer video.pixel-src { opacity: 0 !important; }
  /* Steam-katalog: vaeg af spil-covers som paa Steams egen biblioteksside */
  .cover-wall {
    position: absolute; inset: -7%;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 1.3rem;
    align-content: center;
    padding: 2rem 3rem;
    background: #08080b;
    transform: rotate(-3deg);
  }
  .cover-wall .cw {
    position: relative;
    aspect-ratio: 2 / 3;
    border-radius: 0.6rem;
    overflow: hidden;
    background: rgba(255, 255, 255, 0.06);
    box-shadow: 0 0.8rem 2rem rgba(0, 0, 0, 0.5);
  }
  .cover-wall .cw span {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 3rem; font-weight: 700; color: rgba(255, 255, 255, 0.35);
  }
  .cover-wall .cw img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  .cover-wall .cw img.on { opacity: 1; }
  .cover-wall .cw svg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
  }
  .cover-wall.retro-wall { background: #0a0612; }
  @keyframes slowZoom {
    from { transform: scale(1); }
    to { transform: scale(1.07); }
  }
  #ambient .amb-vignette {
    position: absolute; inset: 0;
    background: linear-gradient(rgba(5, 5, 7, 0) 0%, rgba(5, 5, 7, 0.16) 60%, rgba(5, 5, 7, 0.5) 100%);
  }
  #ambient .amb-dim {
    position: absolute; inset: 0;
    background: rgba(5, 5, 7, 0.46);
    opacity: 0;
    transition: opacity 0.45s ease;
  }
  body.in-section #ambient .amb-dim { opacity: 1; }
  /* Hvor forhaandsvisningen er stjernen: naesten ingen daempning */
  body[data-screen="videos"] #ambient .amb-dim,
  body[data-screen="retro-play"] #ambient .amb-dim { opacity: 0.16; }
  /* Biograf: videoen staar helt ren - vignet og daempning fader vaek */
  #ambient .amb-vignette { transition: opacity 0.45s ease; }
  body.cinema #ambient .amb-vignette { opacity: 0; }
  body.cinema #ambient .amb-dim { opacity: 0; }

  #app {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh;
    transition: opacity 0.7s ease;
  }
  /* Biograf: mens en preview spiller, traeder alt UI tilbage */
  body.cinema #app { opacity: 0; }

  .icon-wrap {
    display: inline-flex; align-items: center; justify-content: center;
    flex: 0 0 auto;
    width: 6.6rem; height: 6.6rem;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.1);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14);
    transition: background-color 0.25s ease, box-shadow 0.25s ease;
  }

  /* ---- Topbar ---- */

  #topbar {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: var(--safe-y) var(--safe-x) 0;
    flex: 0 0 auto;
  }
  #logo { font-size: 1.9rem; font-weight: 700; letter-spacing: 0.02em; }
  #logo span { color: var(--text-dim); }

  /* ---- Skaerme ---- */

  #screens { flex: 1 1 auto; position: relative; overflow: hidden; }
  .screen {
    position: absolute; inset: 0;
    display: none; flex-direction: column;
    padding: 0 var(--safe-x) 1rem;
    overflow: hidden;
  }
  .screen.active { display: flex; animation: screenIn 0.3s ease both; }
  @keyframes screenIn {
    from { opacity: 0; transform: translateY(0.8rem); }
    to { opacity: 1; transform: none; }
  }

  /* ---- Hjem: fuldskaerms hero + tvOS-hylde ---- */

  #screen-home { justify-content: flex-end; gap: 2.6rem; padding-bottom: 2.4rem; }

  .hero { display: flex; flex-direction: column; gap: 0.9rem; }
  .hero .hero-title {
    font-size: 6.2rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.02;
    text-wrap: balance;
  }
  .hero .hero-desc {
    font-size: 1.5rem;
    font-weight: 400;
    color: var(--text-dim);
    max-width: 46ch;
    line-height: 1.5;
  }
  .hero.swap .hero-title, .hero.swap .hero-desc {
    animation: heroIn 0.45s cubic-bezier(0.22, 0.61, 0.36, 1) both;
  }
  .hero.swap .hero-desc { animation-delay: 0.06s; }
  @keyframes heroIn {
    from { opacity: 0; transform: translateY(1rem); }
    to { opacity: 1; transform: none; }
  }

  /* tvOS-hylde: brede app-kort der loefter sig ved fokus - ingen ringe */
  .rail {
    display: flex; gap: 1.5rem; align-items: flex-start;
    overflow-x: auto; scrollbar-width: none;
    padding: 1.4rem 0.6rem 1.8rem;
  }
  .rail::-webkit-scrollbar { display: none; }

  .nav-item {
    flex: 0 0 auto;
    display: flex; flex-direction: column; align-items: center; gap: 0.85rem;
  }

  /* Morkt frosted glas-kort: baerer sin egen kontrast, saa det altid
     staar tydeligt uanset hvor lys eller broget baggrunden er */
  .app-card {
    position: relative;
    width: 17rem;
    aspect-ratio: 16 / 9;
    border-radius: 0.9rem;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    background: rgba(14, 13, 16, 0.62);
    backdrop-filter: blur(18px) saturate(1.1);
    box-shadow: 0 0.6rem 1.8rem rgba(0, 0, 0, 0.55), inset 0 0 0 1.5px rgba(255, 255, 255, 0.16);
    transition: transform 0.28s cubic-bezier(0.2, 0.7, 0.3, 1), background-color 0.28s ease, box-shadow 0.28s ease;
  }
  .app-card .icon-wrap svg {
    width: 3.7rem; height: 3.7rem;
    color: var(--text);
    opacity: 0.9;
    transition: opacity 0.25s ease;
  }
  /* tvOS-sheen: lysstrejf hen over det fokuserede kort */
  .app-card::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(115deg, transparent 32%, rgba(255, 255, 255, 0.22) 48%, transparent 64%);
    background-size: 250% 100%;
    background-position: 150% 0;
    opacity: 0;
    pointer-events: none;
  }
  .nav-item.focused .app-card {
    background: rgba(28, 26, 30, 0.78);
    box-shadow: 0 1.8rem 3.5rem rgba(0, 0, 0, 0.7), inset 0 0 0 1.5px rgba(255, 255, 255, 0.28);
    z-index: 3;
    animation: cardFloat 4.5s ease-in-out 0.3s infinite alternate;
  }
  .nav-item.focused .app-card .icon-wrap svg { opacity: 1; }
  .nav-item.focused .app-card .icon-wrap {
    background: rgba(255, 255, 255, 0.18);
    box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.3);
  }
  @keyframes cardFloat {
    from { transform: scale(1.12) translateY(-0.45rem); }
    to { transform: scale(1.12) translateY(-0.85rem); }
  }
  .nav-item.focused .app-card::after {
    opacity: 1;
    animation: cardSheen 1.1s ease 0.05s 1 both;
  }
  @keyframes cardSheen {
    from { background-position: 150% 0; }
    to { background-position: -60% 0; }
  }

  .app-label {
    font-size: 1.25rem;
    font-weight: 600;
    color: var(--text-dim);
    opacity: 0.75;
    transition: color 0.25s ease, opacity 0.25s ease;
  }
  .nav-item.focused .app-label { color: var(--text); opacity: 1; }

  /* ---- Sektionssider (indhold over hero-baggrunden) ---- */

  .screen-title { font-size: 2.8rem; font-weight: 700; letter-spacing: -0.015em; margin: 0.6rem 0 0.2rem; text-wrap: balance; }
  .screen-subtitle { font-size: 1.3rem; font-weight: 400; color: var(--text-dim); margin-bottom: 0.9rem; }
  .scroll-area { flex: 1 1 auto; overflow-y: auto; scrollbar-width: none; padding: 1.3rem 0.5rem 3rem; }
  .scroll-area::-webkit-scrollbar { display: none; }

  .grid { display: grid; gap: 2rem; }

  /* Fliser i tvOS-stil: glas, loeft og lys - ingen fokusringe */
  .tile {
    position: relative;
    border-radius: var(--radius);
    background: var(--glass);
    backdrop-filter: blur(14px);
    overflow: hidden;
    filter: brightness(0.85);
    box-shadow: 0 0.4rem 1.2rem rgba(0, 0, 0, 0.4);
    transition: transform 0.25s cubic-bezier(0.2, 0.7, 0.3, 1), filter 0.25s ease, box-shadow 0.25s ease;
  }
  .tile.focused {
    transform: scale(1.08);
    filter: brightness(1.05);
    box-shadow: 0 1.4rem 3rem rgba(0, 0, 0, 0.7), 0 0 0 0.14rem rgba(255, 255, 255, 0.35);
    z-index: 2;
  }

  .tile.media-tile { aspect-ratio: 16 / 10; }
  .tile.media-tile .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 3.6rem; }
  .tile.media-tile .thumb {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }

  /* ---- Videoklip: fuldskaerms live-preview, fliser som diskret raekke ---- */

  #screen-videos, #screen-retro { justify-content: flex-end; gap: 1.4rem; padding-bottom: 1.6rem; }
  .vhero { display: flex; flex-direction: column; gap: 0.4rem; }
  .vhero .vhero-title { font-size: 3.8rem; font-weight: 700; letter-spacing: -0.015em; line-height: 1.05; }
  .vhero .vhero-meta { font-size: 1.3rem; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .vrail .tile.media-tile { flex: 0 0 auto; width: 15rem; }
  .tile.media-tile img.thumb {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .tile .caption {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 1.8rem 0.9rem 0.65rem;
    font-size: 1.15rem; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
  }
  .tile .duration {
    position: absolute; top: 0.6rem; right: 0.6rem;
    background: rgba(5, 5, 7, 0.72);
    backdrop-filter: blur(8px);
    padding: 0.12rem 0.65rem; border-radius: 0.55rem;
    font-size: 0.95rem; font-weight: 700; font-variant-numeric: tabular-nums;
  }

  .tile.steam-tile { aspect-ratio: 2 / 3; }
  .tile.steam-tile img.cover {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  /* Retro-covers scannede kassetter/aesker fra flere aera - deres
     naturlige mal varierer meget. "cover" beskar dem forskelligt
     aggressivt og fik dem til at virke som forskellige stoerrelser;
     "contain" viser altid HELE coveret i samme skala, paa en ensartet
     mork bund */
  .tile.steam-tile img.cover.retro-cover {
    object-fit: contain;
    background: #0d0b10;
    padding: 0.4rem;
  }
  .tile.steam-tile .fallback {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1rem; padding: 1.2rem; text-align: center;
  }
  .tile.steam-tile .big-letter { font-size: 4rem; font-weight: 700; color: var(--text); }
  .tile.steam-tile .name { font-size: 1.25rem; font-weight: 600; color: var(--text-dim); }

  .tile .caption .cap-sub {
    display: block;
    font-size: 0.98rem;
    font-weight: 400;
    color: var(--text-dim);
    margin-top: 0.2rem;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ---- Toast ---- */

  #toast {
    position: fixed; top: calc(var(--safe-y) + 0.8rem); left: 50%; transform: translateX(-50%);
    background: rgba(20, 20, 24, 0.85);
    backdrop-filter: blur(16px);
    border: 1px solid var(--line);
    padding: 0.9rem 2.2rem; border-radius: 999px;
    font-size: 1.3rem; font-weight: 600; z-index: 60;
    transition: opacity 0.25s ease;
    max-width: 80vw; text-align: center;
  }
  .hidden { opacity: 0; pointer-events: none; }

  /* ---- Mobil/portraet: forhaandsvisning af TV-konceptet ---- */

  @media (orientation: portrait) {
    .grid { grid-template-columns: repeat(2, 1fr) !important; }
    .hero .hero-title { font-size: 4rem; }
    .app-card { width: 12rem; }
    #screen-home { padding-bottom: 1.4rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .tile, .app-card, #ambient .amb-layer, #ambient .amb-dim { transition: none; animation: none; }
    .screen.active, .hero.swap .hero-title, .hero.swap .hero-desc,
    .nav-item.focused .app-card, .nav-item.focused .app-card::after { animation: none; }
    .nav-item.focused .app-card { transform: scale(1.1); }
  }
</style>

<div id="ambient"></div>
<div id="app">
  <header id="topbar">
    <div id="logo">klopp<span>hits</span></div>
  </header>
  <main id="screens"></main>
  <div id="toast" class="hidden"></div>
</div>

<script>
'use strict';

// ============================================================================
// Ikoner (rene stregikoner, farves med currentColor)
// ============================================================================

var STROKE = 'fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"';

var ICONS = {
  // Klaptrae: mere legende og genkendeligt end en flad rektangel-med-play
  videos: '<svg viewBox="0 0 24 24" ' + STROKE + '><rect x="3" y="10.4" width="18" height="9.6" rx="1.8"/>' +

function el(tag, className, text) {
  var node = document.createElement(tag);

  if (text !== undefined) node.textContent = text;
  return node;
}

function icon(name) {

var toastTimer = null;
function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.add('hidden'); }, 2400);
}

function makeCrtTv() {
  var tv = el('div', 'crt-tv');
  var screenEl = el('div', 'crt-screen');
  var panel = el('div', 'crt-panel');
  panel.appendChild(el('div', 'crt-knob'));
  panel.appendChild(el('div', 'crt-knob crt-knob-lille'));
  panel.appendChild(el('div', 'crt-grille'));
  tv.appendChild(screenEl);
  tv.appendChild(panel);
  return { tv: tv, screen: screenEl };
}

var Ambient = (function () {
  var root = document.getElementById('ambient');
  var layers = [el('div', 'amb-layer'), el('div', 'amb-layer')];
  layers.forEach(function (l) { root.appendChild(l); });
  root.appendChild(el('div', 'amb-vignette'));
  root.appendChild(el('div', 'amb-dim'));
  var active = 0;
  var currentKey = null;

  // Browseren kraever en aegte brugerhandling (tastatur/touch - IKKE
  // gamepad-polling) foer lyd maa afspilles. Naar den forste rigtige
  // handling registreres, forsoeger vi at lyde de(n) video, der koerer.
  var userActivated = false;
  var unmuteWhenActivated = [];
  function onRealGesture() {
    userActivated = true;
    unmuteWhenActivated.splice(0).forEach(function (v) {
      if (!v.isConnected) return;
      v.muted = false;
      v.play && v.play().catch(function () {});
    });
  }
  window.addEventListener('keydown', onRealGesture, { once: true });
  window.addEventListener('pointerdown', onRealGesture, { once: true });

  function stopVideo(layer) {
    var v = layer.querySelector('video');
    if (v) {
      v.pause();
      v.removeAttribute('src');
      v.load();
    }
  }

  function currentVideo() {
    return layers[active].querySelector('video');
  }

  // Stop en igangvaerende preview og fald tilbage til stillbilledet
  function stopPreview() {
    var lay = layers[active];
    var v = lay.querySelector('video');
    if (!v) return false;
    var wrap = lay.querySelector('.crt-tv');
    var art = lay.querySelector('.art-fg');
    document.body.classList.remove('cinema');
    v.classList.remove('on');
    if (wrap) wrap.classList.remove('on');
    if (art) art.classList.remove('skjult');
    setTimeout(function () {
      v.remove();
      if (wrap) wrap.remove();
    }, 900);
    return true;
  }

  function isPreviewing() {
    var v = currentVideo();
    return !!(v && v.classList.contains('on'));
  }

  // spec: { svg: SVG-fallback, node: DOM-element (fx cover-katalog),
  //         img: billed-URL, video: video-URL til live-preview }
  // force: vis igen selv om noeglen er uaendret (bruges til A = afspil igen)
  function show(key, spec, force) {
    if ((key === currentKey && !force) || !spec) return;
    currentKey = key;
    if (!spec.keepCinema) document.body.classList.remove('cinema');
    active = 1 - active;
    var layer = layers[active];
    stopVideo(layer);
    layer.innerHTML = spec.svg || '';
    if (spec.node) layer.appendChild(spec.node);
    if (spec.caption) {
      var cap = document.createElement('div');
      cap.className = 'amb-caption';
      var capTitle = document.createElement('div');
      capTitle.className = 'amb-caption-title';
      capTitle.textContent = spec.caption.title || '';
      cap.appendChild(capTitle);
      if (spec.caption.sub) {
        var capSub = document.createElement('div');
        capSub.className = 'amb-caption-sub';
        capSub.textContent = spec.caption.sub;
        cap.appendChild(capSub);
      }
      layer.appendChild(cap);
    }
    if (spec.img) {
      if (spec.imgArt) {
        // Coveret staar paa svg-baggrunden (Commodore-heroen)
        var fg = new Image();
        fg.className = 'art-fg';
        fg.alt = '';
        fg.onload = function () {
          if (currentKey !== key) return;
          // Kommer coveret foerst efter previewet er startet, skjules det straks
          // (medmindre spec.keepArt beder om at coveret altid skal blive staaende)
          var pv = layer.querySelector('video');
          if (!spec.keepArt && pv && pv.classList.contains('on')) fg.classList.add('skjult');
          layer.appendChild(fg);
        };
        fg.src = spec.img;
      } else {
        var im = new Image();
        im.className = 'hero-img';
        im.alt = '';
        im.onload = function () {
          if (currentKey === key) layer.appendChild(im);
        };
        im.src = spec.img; // ved fejl beholdes SVG-scenen
      }
    }
    if (spec.video) {
      var v = document.createElement('video');
      v.className = 'hero-video';
      v.autoplay = true;
      v.playsInline = true;
      // iOS/Safari kraever attributterne (ikke kun egenskaberne) for autoplay
      v.setAttribute('autoplay', '');
      v.setAttribute('playsinline', '');
      // Afspil med lyd, hvis en aegte bruger-handling har fundet sted (tastatur/touch);
      // ellers maa den starte muted (browserkrav) og lydes, naar handlingen kommer
      if (!userActivated) {
        v.muted = true;
        v.setAttribute('muted', '');
        unmuteWhenActivated.push(v);
      }

      // Pixel-perfekt rendering: video skjules, tegnes paa canvas i stedet
      var pc = null, pctx = null, pcWrap = null;
      if (spec.pixelated) {
        v.classList.add('pixel-src');
        pc = document.createElement('canvas');
        pctx = pc.getContext('2d');
        pcWrap = makeCrtTv();
        pcWrap.screen.appendChild(pc);
      }

      // Coveret fader vaek, mens previewet koerer, og vender tilbage bagefter
      // - medmindre spec.keepArt beder om at det altid skal blive staaende
      function artEl() { return layer.querySelector('.art-fg'); }
      v.addEventListener('playing', function () {
        v.classList.add('on');
        if (pcWrap) pcWrap.tv.classList.add('on');
        if (!spec.keepArt) {
          var art = artEl();
          if (art) art.classList.add('skjult');
        }
        document.body.classList.add('cinema');
      });
      // Afspil een gang (eller til preview-loftet) og fald roligt tilbage
      function endPreview() {
        document.body.classList.remove('cinema');
        v.classList.remove('on');
        if (pcWrap) pcWrap.tv.classList.remove('on');
        var art = artEl();
        if (art) art.classList.remove('skjult');
        setTimeout(function () {
          v.remove();
          if (pcWrap) pcWrap.tv.remove();
        }, 900);
      }
      v.addEventListener('ended', endPreview);
      if (spec.videoMax) {
        var startAt = spec.videoStart || 0;
        v.addEventListener('timeupdate', function () {
          if (v.currentTime - startAt >= spec.videoMax) endPreview();
        });
      }
      // Kandidat-kaede: proev naeste URL ved fejl (mediefiler kraever ingen CORS)
      var srcs = Array.isArray(spec.video) ? spec.video.slice() : [spec.video];
      var si = 0;
      function setSrc() {
        v.src = spec.videoStart ? srcs[si] + '#t=' + spec.videoStart : srcs[si];
        if (v.play) {
          v.play().catch(function () {
            // Autoplay med lyd blev afvist - fald tilbage til muted, saa previewet
            // i det mindste vises; lydes naar en aegte bruger-handling kommer
            if (!v.muted) {
              v.muted = true;
              v.setAttribute('muted', '');
              if (unmuteWhenActivated.indexOf(v) === -1) unmuteWhenActivated.push(v);
              v.play().catch(function () {});
            }
          });
        }
      }
      v.addEventListener('error', function () {
        si++;
        if (si < srcs.length) {
          setSrc();
          return;
        }
        document.body.classList.remove('cinema');
        v.remove();
        if (pcWrap) pcWrap.tv.remove();
        if (spec.onVideoFail) spec.onVideoFail();
      }); // stillbilledet bliver staaende
      setSrc();
      layer.appendChild(v);
      if (pcWrap) {
        layer.appendChild(pcWrap.tv);
        (function loop() {
          if (!v.isConnected) return;
          if (v.videoWidth) {
            if (pc.width !== v.videoWidth) {
              pc.width = v.videoWidth;
              pc.height = v.videoHeight;
            }
            pctx.drawImage(v, 0, 0);
          }
          requestAnimationFrame(loop);
        })();
      }
    }
    layer.classList.add('visible');
    var hidden = layers[1 - active];
    hidden.classList.remove('visible');
    // Stop skjult video naar crossfaden er faerdig (spar baandbredde/batteri)
    setTimeout(function () {
      if (!hidden.classList.contains('visible')) stopVideo(hidden);
    }, 1400);
  }
  return { show: show, stopPreview: stopPreview, isPreviewing: isPreviewing };
})();

// C64-longplays: fan-optagede gennemspilninger, distribueret via
// Archive.org (World of Longplays / MadMatty). Streames direkte;
// previews starter et stykke inde og stopper efter 15 sekunder.
// Slaar det praecise MP4-filnavn op i et archive.org-arkiv ved runtime
// (metadata-API'et er CORS-aabent). Ingen gaettede filnavne.
var iaMetaCache = {};
function resolveArchiveMp4(item, match) {
  if (!iaMetaCache[item]) {
    iaMetaCache[item] = fetch('https://archive.org/metadata/' + item)
      .then(function (r) { return r.json(); });
  }
  return iaMetaCache[item].then(function (meta) {
    var files = (meta.files || []).filter(function (f) {
      return /\.mp4$/i.test(f.name) && (!match || match.test(f.name));
    });
    if (!files.length) return null;
    // Foretraek den mindste fil (typisk web-afledningen)
    files.sort(function (a, b) { return (+a.size || 9e12) - (+b.size || 9e12); });
    return 'https://archive.org/download/' + item + '/' +
      encodeURIComponent(files[0].name).replace(/%2F/g, '/');
  }).catch(function () { return null; });
}

// ============================================================================
// Fokus-gitter
// ============================================================================

function Grid(cols) {
  this.cols = cols;
  this.items = [];
  this.index = 0;
}
Grid.prototype.setItems = function (elements) {
  this.items = elements;
  this.index = Math.min(this.index, Math.max(0, elements.length - 1));
  this.applyFocus(false);
};
Grid.prototype.applyFocus = function (scroll) {
  var idx = this.index;
  this.items.forEach(function (item, i) { item.classList.toggle('focused', i === idx); });
  var cur = this.items[idx];
  if (cur && scroll !== false) cur.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
};
Grid.prototype.move = function (dir) {
  if (!this.items.length) return false;
  var i = this.index;
  if (dir === 'left') i -= 1;
  else if (dir === 'right') i += 1;
  else if (dir === 'up') i -= this.cols;
  else if (dir === 'down') i += this.cols;
  else return false;
  if (dir === 'down' && i >= this.items.length) {
    var lastRowStart = Math.floor((this.items.length - 1) / this.cols) * this.cols;
    if (this.index < lastRowStart) i = this.items.length - 1; else return false;
  }
  if (i < 0 || i >= this.items.length || i === this.index) return false;
  this.index = i;
  this.applyFocus();
  return true;
};
Object.defineProperty(Grid.prototype, 'current', {
  get: function () { return this.items[this.index] || null; }
});

// Touch: foerste tryk fokuserer, andet tryk aabner
function tapToFocus(focus, element, activate, onFocus) {
  element.addEventListener('click', function () {
    if (focus.current === element) {
      activate();
    } else {
      var i = focus.items.indexOf(element);
      if (i !== -1) {
        focus.index = i;
        focus.applyFocus();
        if (onFocus) onFocus();
      }
    }
  });
}

var Screens = {
  stack: [],
  push: function (screen, params) {
    var prev = this.top();
    if (prev) prev.el.classList.remove('active');
    this.stack.push(screen);
    screen.el.classList.add('active');
    if (screen.enter) screen.enter(params);
    this.refresh();
  },
  pop: function () {
    var screen = this.stack.pop();
    if (screen) {
      if (screen.leave) screen.leave();
      screen.el.classList.remove('active');
    }
    var top = this.top();
    if (top) {
      top.el.classList.add('active');
      if (top.resume) top.resume();
    }
    this.refresh();
  },
  top: function () { return this.stack[this.stack.length - 1] || null; },
  refresh: function () {
    var top = this.top();
    var onHome = top === homeScreen;
    document.body.classList.toggle('on-home', onHome);
    document.body.classList.toggle('in-section', !onHome);
    document.body.dataset.screen = top ? top.el.id.replace('screen-', '') : '';
  },
  handle: function (action) {
    var top = this.top();
    if (top && top.onInput) top.onInput(action);
  }
};

function makeScreen(id, build) {
  var container = document.getElementById('screens');
  var root = el('section', 'screen');
  root.id = 'screen-' + id;
  container.appendChild(root);
  var screen = { el: root };
  build(screen, root);
  return screen;
}

    else if (target === 'steam') Screens.push(steamScreen);
    else if (target === 'retro') Screens.push(retroScreen);

  });

  screen.resume = function () { syncHero(false); };
  screen.onInput = function (action) {
    if (action === 'left' || action === 'up') { if (focus.move('left')) syncHero(true); }
    else if (action === 'right' || action === 'down') { if (focus.move('right')) syncHero(true); }
    else if (action === 'a') {

  };

function conceptToast() {

function makeSection(id, title, subtitle, cols, buildTiles, onFocusChange, onSelect) {
  return makeScreen(id, function (screen, root) {
    root.appendChild(el('h2', 'screen-title', title));
    root.appendChild(el('p', 'screen-subtitle', subtitle));
    var area = el('div', 'scroll-area');
    root.appendChild(area);
    var grid = el('div', 'grid');
    grid.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
    area.appendChild(grid);

    var focus = new Grid(cols);
    var tiles = buildTiles(grid);
    focus.setItems(tiles);

    var select = onSelect || conceptToast;

    function focusChanged() {
      if (onFocusChange) onFocusChange(focus.index);
      else Ambient.show(id, { svg: HEROES[id] });
    }

    tiles.forEach(function (tile) {
      tapToFocus(focus, tile, function () { select(focus.index); }, focusChanged);
    });

    screen.enter = function () { focus.index = 0; focus.applyFocus(false); focusChanged(); };
    // Genopfrisk hero/baggrund, naar man vender tilbage fra en underside
    screen.resume = focusChanged;
    screen.onInput = function (action) {
      if (['up', 'down', 'left', 'right'].indexOf(action) !== -1) {
        if (focus.move(action)) focusChanged();
      }
      else if (action === 'a') select(focus.index);
      else if (action === 'b') Screens.pop();
    };
  });
}

        tile.appendChild(cover);
      }
      grid.appendChild(tile);
      return tile;
    });
  },
  function () {
    // Statisk - regnbuen skifter aldrig, uanset hvilket cover der er fokuseret.
    // Egen noegle (ikke 'retro'), saa den ikke kolliderer med hjemmeskaermens
    // hover-forhaandsvisning af det samme kort og dropper opdateringen.
    Ambient.show('retro-grid', { svg: RETRO_ART_HERO });
  },
  function (i) {
    var g = LONGPLAYS[i];
    if (g.playUrl) { window.location.href = g.playUrl; return; }
    Screens.push(retroPlayScreen, i);
  }
);

// Retro-afspilning: fuldskaerms gameplay i CRT-ramme, der starter med det
// samme. Samme statiske regnbue-baggrund som gitteret.
var retroPlayScreen = makeScreen('retro-play', function (screen, root) {
  var current = null;

  function attempt(g, i, urls) {
    Ambient.show('retro-play:' + i, {
      svg: RETRO_ART_HERO,
      img: g.cover,
      imgArt: true,
      keepArt: true, // cover, tekst og video vises samtidig - intet fader vaek
      caption: { title: g.name, sub: g.sub },
      keepCinema: true,
      video: urls,
      videoStart: g.start,
      pixelated: true, // testens vinder: pixel-perfekt C64-rendering
      onVideoFail: function () {
        // Alle kandidater fejlede: slaa filnavnet op som sidste udvej
        if (g.resolved || !g.item) return;
        g.resolved = true;
        resolveArchiveMp4(g.item, g.match).then(function (url) {
          if (url && current === i && document.body.dataset.screen === 'retro-play') {
            g.urls = [url];
            attempt(g, i, g.urls);
          }
        });
      }
    }, true);
  }

  function play(i) {
    current = i;
    var g = LONGPLAYS[i];
    var candidates = g.urls || (g.url ? [g.url] : null);
    var stillSpec = { svg: RETRO_ART_HERO, img: g.cover, imgArt: true, caption: { title: g.name, sub: g.sub } };
    if (candidates) {
      attempt(g, i, candidates);
    } else if (g.item && !g.resolved) {
      // Intet gaettet filnavn - vis coveret straks og slaa det rigtige
      // filnavn op via metadata-API'et, saa videoen kan koble sig paa
      g.resolved = true;
      Ambient.show('retro-play:' + i, stillSpec, true);
      resolveArchiveMp4(g.item, g.match).then(function (url) {
        if (url && current === i) { g.urls = [url]; attempt(g, i, g.urls); }
      });
    } else {
      Ambient.show('retro-play:' + i, stillSpec, true);
    }
  }

  screen.enter = function (index) {
    document.body.classList.add('cinema');
    play(index);
  };
  screen.leave = function () {
    Ambient.stopPreview();
    current = null;
  };
  screen.onInput = function (action) {
    if (action === 'b') {
      document.body.classList.remove('cinema');
      Screens.pop();
    }
  };
});

// ============================================================================
// Input: Gamepad API + tastatur
// ============================================================================

var Input = (function () {
  var listeners = [];
  var REPEAT_DELAY = 420, REPEAT_RATE = 130, STICK_THRESHOLD = 0.55;
  var DIRECTIONAL = { up: 1, down: 1, left: 1, right: 1 };
  var BUTTON_MAP = { 0: 'a', 1: 'b', 12: 'up', 13: 'down', 14: 'left', 15: 'right' };
  var held = {};

  function emit(action) { listeners.forEach(function (fn) { fn(action); }); }

  function activeActions() {
    var actions = {};
    var pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (var p = 0; p < pads.length; p++) {
      var pad = pads[p];
      if (!pad) continue;
      for (var i = 0; i < pad.buttons.length; i++) {
        if (pad.buttons[i].pressed && BUTTON_MAP[i]) actions[BUTTON_MAP[i]] = 1;
      }
      if (pad.axes.length >= 2) {
        if (pad.axes[0] < -STICK_THRESHOLD) actions.left = 1;
        if (pad.axes[0] > STICK_THRESHOLD) actions.right = 1;
        if (pad.axes[1] < -STICK_THRESHOLD) actions.up = 1;
        if (pad.axes[1] > STICK_THRESHOLD) actions.down = 1;
      }
    }
    return actions;
  }

  function tick() {
    var now = performance.now();
    var actions = activeActions();
    Object.keys(held).forEach(function (a) { if (!actions[a]) delete held[a]; });
    Object.keys(actions).forEach(function (action) {
      var h = held[action];
      if (!h) {
        held[action] = { since: now, lastRepeat: now };
        emit(action);
      } else if (DIRECTIONAL[action] && now - h.since >= REPEAT_DELAY && now - h.lastRepeat >= REPEAT_RATE) {
        h.lastRepeat = now;
        emit(action);
      }
    });
    requestAnimationFrame(tick);
  }

  var KEY_MAP = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    Enter: 'a', Escape: 'b', Backspace: 'b'
  };
  window.addEventListener('keydown', function (ev) {
    var action = KEY_MAP[ev.key];
    if (action) { ev.preventDefault(); emit(action); }
  });

  requestAnimationFrame(tick);
  return { on: function (fn) { listeners.push(fn); } };
})();

// ============================================================================
// Opstart
// ============================================================================

// Touch: et tryk paa logoet gaar tilbage til forsiden
document.getElementById('logo').addEventListener('click', function () {
  while (Screens.stack.length > 1) Screens.pop();
});

Input.on(function (action) {
  Screens.handle(action);
});

Screens.push(homeScreen);
</script>
