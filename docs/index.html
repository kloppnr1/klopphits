<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="KloppHits koncept-UI: controller-styret big screen-oplevelse til billeder, videoklip, Steam og retro-spil.">
<title>KloppHits – Koncept-UI</title>
</head>
<body>
<style>
  /* KloppHits koncept-UI — Apple TV-inspireret fuldskaermsnavigation.
     Hver sektion fylder hele skaermen med et stemningsfuldt hero-baggrunds-
     billede der crossfader ved fokusskift. I den rigtige app er baggrundene
     dine egne billeder, videostills og Steam-covers.
     Skandinavisk identitet: koelig grafit, nordisk isblaa accent, rene
     stregikoner, luft og rolige overgange. Bevidst kun moerkt tema (TV).
     1rem skalerer med skaermen, saa alt ser ens ud paa 1080p og 4K. */

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #101216;
    --bg-soft: #191c22;
    --panel: #20242b;
    --line: #2c313a;
    --accent: #8fbfd1;
    --accent-soft: #bcdde9;
    --accent-glow: rgba(143, 191, 209, 0.42);
    --text: #eef0f3;
    --text-dim: #9aa3ae;
    --radius: 1.1rem;
    --focus-width: 0.26rem;
    --safe-x: 5vw;
    --safe-y: 2.5vh;
    color-scheme: dark;
  }

  html {
    font-size: min(calc(100vh / 67.5), calc(100vw / 52));
    font-size: min(calc(100dvh / 67.5), calc(100vw / 52));
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Helvetica Neue", "Noto Sans", Ubuntu, sans-serif;
    user-select: none;
  }

  /* ---- Fuldskaerms hero-baggrund ---- */

  #ambient { position: fixed; inset: -3vw; z-index: 0; pointer-events: none; }
  #ambient .amb-layer {
    position: absolute; inset: 0;
    opacity: 0;
    transition: opacity 1.1s ease;
    animation: slowZoom 36s ease-in-out infinite alternate;
  }
  #ambient .amb-layer.visible { opacity: 1; }
  #ambient .amb-layer svg { width: 100%; height: 100%; display: block; }
  #ambient .amb-layer .hero-img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  #ambient .amb-layer video.hero-video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.8s ease;
  }
  #ambient .amb-layer video.hero-video.on { opacity: 1; }
  @keyframes slowZoom {
    from { transform: scale(1); }
    to { transform: scale(1.07); }
  }
  #ambient .amb-vignette {
    position: absolute; inset: 0;
    background: linear-gradient(rgba(16, 18, 22, 0.12) 0%, rgba(16, 18, 22, 0.34) 55%, var(--bg) 97%);
  }
  #ambient .amb-dim {
    position: absolute; inset: 0;
    background: rgba(16, 18, 22, 0.62);
    opacity: 0;
    transition: opacity 0.45s ease;
  }
  body.in-section #ambient .amb-dim { opacity: 1; }
  /* I video-sektionen er selve forhaandsvisningen stjernen - naesten ingen daempning */
  body[data-screen="videos"] #ambient .amb-dim { opacity: 0.22; }

  #app { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

  .icon-wrap { display: inline-flex; flex: 0 0 auto; }

  /* ---- Topbar ---- */

  #topbar {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: var(--safe-y) var(--safe-x) 0;
    flex: 0 0 auto;
  }
  #logo { font-size: 1.9rem; font-weight: 700; letter-spacing: 0.05em; }
  #logo span { color: var(--accent); }

  /* ---- Skaerme ---- */

  #screens { flex: 1 1 auto; position: relative; overflow: hidden; }
  .screen {
    position: absolute; inset: 0;
    display: none; flex-direction: column;
    padding: 0 var(--safe-x) 1rem;
    overflow: hidden;
  }
  .screen.active { display: flex; animation: screenIn 0.3s ease both; }
  @keyframes screenIn {
    from { opacity: 0; transform: translateY(0.8rem); }
    to { opacity: 1; transform: none; }
  }

  /* ---- Hjem: fuldskaerms hero + pille-navigation ---- */

  #screen-home { justify-content: flex-end; gap: 2.6rem; padding-bottom: 2.4rem; }

  .hero { display: flex; flex-direction: column; gap: 0.9rem; }
  .hero .hero-title {
    font-size: 6.4rem;
    font-weight: 200;
    letter-spacing: -0.015em;
    line-height: 1.02;
    text-wrap: balance;
  }
  .hero .hero-desc {
    font-size: 1.5rem;
    font-weight: 400;
    color: var(--text-dim);
    max-width: 46ch;
    line-height: 1.5;
  }
  .hero.swap .hero-title, .hero.swap .hero-desc {
    animation: heroIn 0.45s cubic-bezier(0.22, 0.61, 0.36, 1) both;
  }
  .hero.swap .hero-desc { animation-delay: 0.06s; }
  @keyframes heroIn {
    from { opacity: 0; transform: translateY(1rem); }
    to { opacity: 1; transform: none; }
  }

  .rail {
    display: flex; gap: 1rem; align-items: center;
    overflow-x: auto; scrollbar-width: none;
    padding: 0.5rem 0.4rem;
  }
  .rail::-webkit-scrollbar { display: none; }

  .card {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 0.9rem;
    padding: 0.95rem 1.7rem;
    border-radius: 999px;
    background: rgba(25, 28, 34, 0.55);
    border: 1px solid rgba(44, 49, 58, 0.8);
    backdrop-filter: blur(10px);
    color: var(--text-dim);
    outline: var(--focus-width) solid transparent;
    outline-offset: -1px;
    transition: background-color 0.25s ease, color 0.25s ease, outline-color 0.2s ease,
      border-color 0.2s ease, box-shadow 0.25s ease, transform 0.25s ease;
  }
  .card.focused {
    background: rgba(35, 40, 48, 0.85);
    color: var(--text);
    outline-color: var(--accent);
    border-color: transparent;
    box-shadow: 0 0 0 var(--focus-width) var(--accent-glow), 0 0.9rem 2.4rem rgba(0, 0, 0, 0.5);
    transform: translateY(-0.2rem);
  }
  .card .icon-wrap svg { width: 1.7rem; height: 1.7rem; color: currentColor; transition: color 0.25s ease; }
  .card.focused .icon-wrap svg { color: var(--accent); }
  .card .label { font-size: 1.3rem; font-weight: 600; white-space: nowrap; }

  /* ---- Sektionssider (indhold over hero-baggrunden) ---- */

  .screen-title { font-size: 2.8rem; font-weight: 200; letter-spacing: -0.01em; margin: 0.6rem 0 0.2rem; text-wrap: balance; }
  .screen-subtitle { font-size: 1.3rem; font-weight: 400; color: var(--text-dim); margin-bottom: 0.9rem; }
  .scroll-area { flex: 1 1 auto; overflow-y: auto; scrollbar-width: none; padding: 1.3rem 0.5rem 3rem; }
  .scroll-area::-webkit-scrollbar { display: none; }

  .grid { display: grid; gap: 2rem; }

  .tile {
    position: relative;
    border-radius: var(--radius);
    background: rgba(32, 36, 43, 0.66);
    border: 1px solid rgba(44, 49, 58, 0.8);
    backdrop-filter: blur(8px);
    overflow: hidden;
    transition: transform 0.15s ease, box-shadow 0.15s ease, outline-color 0.15s ease, border-color 0.15s ease;
    outline: var(--focus-width) solid transparent;
    outline-offset: -1px;
  }
  .tile.focused {
    transform: scale(1.05);
    outline-color: var(--accent);
    border-color: transparent;
    box-shadow: 0 0 0 var(--focus-width) var(--accent-glow), 0 1.2rem 3rem rgba(0, 0, 0, 0.55);
    z-index: 2;
  }

  .tile.media-tile { aspect-ratio: 16 / 10; }
  .tile.media-tile .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 3.6rem; }
  .tile.media-tile .thumb {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }

  /* ---- Videoklip: fuldskaerms live-preview, fliser som diskret raekke ---- */

  #screen-videos { justify-content: flex-end; gap: 1.4rem; padding-bottom: 1.6rem; }
  .vhero { display: flex; flex-direction: column; gap: 0.4rem; }
  .vhero .vhero-title { font-size: 3.8rem; font-weight: 200; letter-spacing: -0.01em; line-height: 1.05; }
  .vhero .vhero-meta { font-size: 1.3rem; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .vrail .tile.media-tile { flex: 0 0 auto; width: 15rem; }
  .tile .caption {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 1.8rem 0.9rem 0.65rem;
    font-size: 1.15rem; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
  }
  .tile .duration {
    position: absolute; top: 0.6rem; right: 0.6rem;
    background: rgba(16, 18, 22, 0.85); border: 1px solid var(--line);
    padding: 0.1rem 0.6rem; border-radius: 0.5rem;
    font-size: 0.95rem; font-weight: 700; font-variant-numeric: tabular-nums;
  }

  .tile.steam-tile { aspect-ratio: 2 / 3; }
  .tile.steam-tile img.cover {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .tile.steam-tile .fallback {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1rem; padding: 1.2rem; text-align: center;
  }
  .tile.steam-tile .big-letter { font-size: 4rem; font-weight: 700; color: var(--accent); }
  .tile.steam-tile .name { font-size: 1.25rem; font-weight: 600; color: var(--text-dim); }

  .tile .caption .cap-sub {
    display: block;
    font-size: 0.98rem;
    font-weight: 400;
    color: var(--text-dim);
    margin-top: 0.2rem;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .tile.settings-tile {
    aspect-ratio: 16 / 10;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 1rem; text-align: center; padding: 1.5rem;
  }
  .tile.settings-tile .icon-wrap svg { width: 3.2rem; height: 3.2rem; color: var(--accent); }
  .tile.settings-tile .label { font-size: 1.45rem; font-weight: 650; }
  .tile.settings-tile .value { font-size: 1.1rem; color: var(--text-dim); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .rows { display: flex; flex-direction: column; gap: 1rem; max-width: 75rem; }
  .row-item {
    display: flex; align-items: center; justify-content: space-between; gap: 1.5rem;
    padding: 1.5rem 2rem;
    border-radius: var(--radius);
    background: rgba(32, 36, 43, 0.66); border: 1px solid rgba(44, 49, 58, 0.8);
    backdrop-filter: blur(8px);
    outline: var(--focus-width) solid transparent; outline-offset: -1px;
    transition: transform 0.12s ease, outline-color 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
  }
  .row-item.focused {
    transform: scale(1.012);
    outline-color: var(--accent); border-color: transparent;
    box-shadow: 0 0 0 var(--focus-width) var(--accent-glow);
  }
  .row-item .row-label { font-size: 1.5rem; font-weight: 650; display: flex; align-items: center; gap: 1rem; }
  .row-item .row-label svg { width: 1.7rem; height: 1.7rem; color: var(--accent); }
  .row-item .row-value { font-size: 1.25rem; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---- Knap-badges (bruges i intro-kortet) ---- */

  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 2.2rem; height: 2.2rem; padding: 0 0.65rem;
    border-radius: 999px;
    background: rgba(25, 28, 34, 0.85); border: 1px solid var(--line);
    font-weight: 700; font-size: 1rem; color: var(--text);
  }
  .btn.btn-a { border-color: #5d9e70; color: #9ed4ac; }
  .btn.btn-b { border-color: #b56a5f; color: #e5a89e; }

  /* ---- Toast ---- */

  #toast {
    position: fixed; top: calc(var(--safe-y) + 0.8rem); left: 50%; transform: translateX(-50%);
    background: rgba(25, 28, 34, 0.96); border: 1px solid var(--accent);
    padding: 0.9rem 2.2rem; border-radius: 999px;
    font-size: 1.3rem; font-weight: 600; z-index: 60;
    transition: opacity 0.25s ease;
    max-width: 80vw; text-align: center;
  }
  .hidden { opacity: 0; pointer-events: none; }

  /* ---- Mobil/portraet: forhaandsvisning af TV-konceptet ---- */

  @media (orientation: portrait) {
    .grid { grid-template-columns: repeat(2, 1fr) !important; }
    .hero .hero-title { font-size: 4rem; }
    #screen-home { padding-bottom: 1.4rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .tile, .row-item, .card, #ambient .amb-layer, #ambient .amb-dim { transition: none; animation: none; }
    .screen.active, .hero.swap .hero-title, .hero.swap .hero-desc { animation: none; }
  }
</style>

<div id="ambient"></div>
<div id="app">
  <header id="topbar">
    <div id="logo">klopp<span>hits</span></div>
  </header>
  <main id="screens"></main>
  <div id="toast" class="hidden"></div>
</div>

<script>
'use strict';

// ============================================================================
// Ikoner (rene stregikoner, farves med currentColor)
// ============================================================================

var STROKE = 'fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"';

var ICONS = {
  photos: '<svg viewBox="0 0 24 24" ' + STROKE + '><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="2"/><path d="M3 17l5-4 4 3 4.5-4.5L21 16"/></svg>',
  videos: '<svg viewBox="0 0 24 24" ' + STROKE + '><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 9.5h3.5M3 14.5h3.5M17.5 9.5H21M17.5 14.5H21M6.5 5v14M17.5 5v14"/><path d="M10.6 9.8v4.4l3.8-2.2z" fill="currentColor" stroke="none"/></svg>',
  steam: '<svg viewBox="0 0 24 24" ' + STROKE + '><path d="M6.8 7.5h10.4a4.8 4.8 0 0 1 4.77 5.3c-.2 1.9-1.7 3.7-3.67 3.7-1.11 0-2.16-.53-2.83-1.42L14.3 13.6H9.7l-1.17 1.48c-.67.89-1.72 1.42-2.83 1.42-1.97 0-3.47-1.8-3.67-3.7A4.8 4.8 0 0 1 6.8 7.5z"/><path d="M8.2 10.4v3M6.7 11.9h3"/><circle cx="15.3" cy="11" r="0.9" fill="currentColor" stroke="none"/><circle cx="17.6" cy="12.9" r="0.9" fill="currentColor" stroke="none"/></svg>',
  retro: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 4h2v2H5zM17 4h2v2h-2zM7 6h2v2H7zM15 6h2v2h-2zM5 8h14v2H5zM3 10h4v2H3zM9 10h6v2H9zM17 10h4v2h-4zM1 12h22v2H1zM1 14h2v2H1zM5 14h14v2H5zM21 14h2v2h-2zM1 16h2v2H1zM5 16h2v2H5zM17 16h2v2h-2zM21 16h2v2h-2zM7 18h4v2H7zM13 18h4v2h-4z"/></svg>',
  settings: '<svg viewBox="0 0 24 24" ' + STROKE + '><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .33 1.77l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.6 1.6 0 0 0 15 19.4a1.6 1.6 0 0 0-1 1.47V21a2 2 0 1 1-4 0v-.09A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.77.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.6 1.6 0 0 0 4.6 15a1.6 1.6 0 0 0-1.47-1H3a2 2 0 1 1 0-4h.09A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.33-1.77l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.6 1.6 0 0 0 9 4.6a1.6 1.6 0 0 0 1-1.47V3a2 2 0 1 1 4 0v.09a1.6 1.6 0 0 0 1 1.47 1.6 1.6 0 0 0 1.77-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.6 1.6 0 0 0 19.4 9c.26.6.86 1 1.51 1H21a2 2 0 1 1 0 4h-.09c-.65 0-1.25.4-1.51 1z"/></svg>',
  power: '<svg viewBox="0 0 24 24" ' + STROKE + '><path d="M12 3v8"/><path d="M6.3 6.5a8 8 0 1 0 11.4 0"/></svg>'
};

// ============================================================================
// Hjaelpere
// ============================================================================

function el(tag, className, text) {
  var node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function icon(name) {
  var wrap = el('span', 'icon-wrap');
  wrap.innerHTML = ICONS[name];
  return wrap;
}

var toastTimer = null;
function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.add('hidden'); }, 2400);
}

function scene(hue1, hue2, emoji) {
  return {
    bg: 'linear-gradient(150deg, hsl(' + hue1 + ' 28% 34%) 0%, hsl(' + hue2 + ' 32% 14%) 85%)',
    h1: hue1,
    h2: hue2,
    emoji: emoji
  };
}

// ============================================================================
// Hero-scener pr. sektion (i den rigtige app: dine billeder & Steam-covers)
// ============================================================================

// Haandbyggede SVG-scener, 1920x1080, beskaeres med "slice" som et foto.

var SVG_OPEN = '<svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">';

function stars(seedX, count, yMax, color) {
  var out = '';
  for (var i = 0; i < count; i++) {
    var x = ((seedX + i * 379) % 1900) + 10;
    var y = ((i * 233 + seedX * 7) % yMax) + 20;
    var r = 1 + (i % 3);
    var o = 0.35 + ((i * 17) % 50) / 100;
    out += '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + color + '" opacity="' + o + '"/>';
  }
  return out;
}

// Fuldskaerms-scene for et enkelt element (i den rigtige app: selve billedet)
function sceneSvg(s, uid) {
  return SVG_OPEN +
    '<defs><linearGradient id="sc-' + uid + '" x1="0" y1="0" x2="1" y2="1">' +
    '<stop offset="0" stop-color="hsl(' + s.h1 + ' 30% 36%)"/>' +
    '<stop offset="1" stop-color="hsl(' + s.h2 + ' 34% 12%)"/></linearGradient>' +
    '<radialGradient id="scg-' + uid + '"><stop offset="0" stop-color="hsl(' + s.h1 + ' 60% 70%)" stop-opacity="0.32"/><stop offset="1" stop-color="hsl(' + s.h1 + ' 60% 70%)" stop-opacity="0"/></radialGradient></defs>' +
    '<rect width="1920" height="1080" fill="url(#sc-' + uid + ')"/>' +
    '<ellipse cx="1250" cy="420" rx="720" ry="440" fill="url(#scg-' + uid + ')"/>' +
    '<text x="960" y="710" font-size="430" text-anchor="middle" opacity="0.3">' + s.emoji + '</text>' +
    '</svg>';
}

var HEROES = {

  // Nordisk fjord i solnedgang
  photos: SVG_OPEN +
    '<defs>' +
    '<linearGradient id="ph-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#33204d"/><stop offset="0.45" stop-color="#96462e"/><stop offset="0.72" stop-color="#eba75f"/></linearGradient>' +
    '<radialGradient id="ph-glow"><stop offset="0" stop-color="#ffe9c4"/><stop offset="0.3" stop-color="#ffcf8a" stop-opacity="0.8"/><stop offset="1" stop-color="#ffcf8a" stop-opacity="0"/></radialGradient>' +
    '<linearGradient id="ph-sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d98a4f"/><stop offset="1" stop-color="#1c1220"/></linearGradient>' +
    '</defs>' +
    '<rect width="1920" height="760" fill="url(#ph-sky)"/>' +
    '<circle cx="1250" cy="640" r="340" fill="url(#ph-glow)"/>' +
    '<circle cx="1250" cy="640" r="84" fill="#ffe2ad"/>' +
    '<polygon points="0,760 0,520 190,600 390,470 560,590 760,500 900,620 1050,560 1200,660 1500,590 1920,640 1920,760" fill="#54314a" opacity="0.85"/>' +
    '<polygon points="0,760 0,620 240,665 480,585 700,680 950,625 1180,700 1450,645 1700,710 1920,665 1920,760" fill="#37223a"/>' +
    '<rect y="760" width="1920" height="320" fill="url(#ph-sea)"/>' +
    '<rect x="1140" y="760" width="220" height="320" fill="#ffcf8a" opacity="0.15"/>' +
    '<rect x="1090" y="800" width="330" height="6" rx="3" fill="#ffd9a0" opacity="0.35"/>' +
    '<rect x="1140" y="850" width="220" height="5" rx="2.5" fill="#ffd9a0" opacity="0.28"/>' +
    '<rect x="1170" y="905" width="160" height="4" rx="2" fill="#ffd9a0" opacity="0.2"/>' +
    '<polygon points="0,1080 0,905 300,985 520,935 760,1015 1200,960 1920,1000 1920,1080" fill="#120e16"/>' +
    '<path d="M480 300 q18 -16 36 0 q18 -16 36 0" stroke="#2c1a2e" stroke-width="6" fill="none" stroke-linecap="round"/>' +
    '<path d="M600 350 q14 -13 28 0 q14 -13 28 0" stroke="#2c1a2e" stroke-width="5" fill="none" stroke-linecap="round"/>' +
    '</svg>',

  // Blaa time: maane over havet
  videos: SVG_OPEN +

var Ambient = (function () {
  var root = document.getElementById('ambient');
  var layers = [el('div', 'amb-layer'), el('div', 'amb-layer')];
  layers.forEach(function (l) { root.appendChild(l); });
  root.appendChild(el('div', 'amb-vignette'));
  root.appendChild(el('div', 'amb-dim'));
  var active = 0;
  var currentKey = null;

  function stopVideo(layer) {
    var v = layer.querySelector('video');
    if (v) {
      v.pause();
      v.removeAttribute('src');
      v.load();
    }
  }

  // spec: { svg: SVG-fallback, img: billed-URL (fx Steam hero),
  //         video: video-URL til live-preview (muted loop) }
  function show(key, spec) {
    if (key === currentKey || !spec) return;
    currentKey = key;
    active = 1 - active;
    var layer = layers[active];
    stopVideo(layer);
    layer.innerHTML = spec.svg || '';
    if (spec.img) {
      var im = new Image();
      im.className = 'hero-img';
      im.alt = '';
      im.onload = function () {
        if (currentKey === key) layer.appendChild(im);
      };
      im.src = spec.img; // ved fejl beholdes SVG-scenen
    }
    if (spec.video) {
      var v = document.createElement('video');
      v.className = 'hero-video';
      v.muted = true;
      v.loop = true;
      v.autoplay = true;
      v.playsInline = true;
      // iOS/Safari kraever attributterne (ikke kun egenskaberne) for autoplay
      v.setAttribute('muted', '');
      v.setAttribute('autoplay', '');
      v.setAttribute('loop', '');
      v.setAttribute('playsinline', '');
      v.addEventListener('playing', function () { v.classList.add('on'); });
      v.addEventListener('error', function () { v.remove(); }); // SVG-scenen bliver staaende
      v.src = spec.video;
      layer.appendChild(v);
      if (v.play) v.play().catch(function () {});
    }
    layer.classList.add('visible');
    var hidden = layers[1 - active];
    hidden.classList.remove('visible');
    // Stop skjult video naar crossfaden er faerdig (spar baandbredde/batteri)
    setTimeout(function () {
      if (!hidden.classList.contains('visible')) stopVideo(hidden);
    }, 1400);
  }
  return { show: show };
})();

// Fokus-gitter
// ============================================================================

function Grid(cols) {
  this.cols = cols;
  this.items = [];
  this.index = 0;
}
Grid.prototype.setItems = function (elements) {
  this.items = elements;
  this.index = Math.min(this.index, Math.max(0, elements.length - 1));
  this.applyFocus(false);
};
Grid.prototype.applyFocus = function (scroll) {
  var idx = this.index;
  this.items.forEach(function (item, i) { item.classList.toggle('focused', i === idx); });
  var cur = this.items[idx];
  if (cur && scroll !== false) cur.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
};
Grid.prototype.move = function (dir) {
  if (!this.items.length) return false;
  var i = this.index;
  if (dir === 'left') i -= 1;
  else if (dir === 'right') i += 1;
  else if (dir === 'up') i -= this.cols;
  else if (dir === 'down') i += this.cols;
  else return false;
  if (dir === 'down' && i >= this.items.length) {
    var lastRowStart = Math.floor((this.items.length - 1) / this.cols) * this.cols;
    if (this.index < lastRowStart) i = this.items.length - 1; else return false;
  }
  if (i < 0 || i >= this.items.length || i === this.index) return false;
  this.index = i;
  this.applyFocus();
  return true;
};
Object.defineProperty(Grid.prototype, 'current', {
  get: function () { return this.items[this.index] || null; }
});

// Touch: foerste tryk fokuserer, andet tryk aabner
function tapToFocus(focus, element, activate, onFocus) {
  element.addEventListener('click', function () {
    if (focus.current === element) {
      activate();
    } else {
      var i = focus.items.indexOf(element);
      if (i !== -1) {
        focus.index = i;
        focus.applyFocus();
        if (onFocus) onFocus();
      }
    }
  });
}

var Screens = {
  stack: [],
  push: function (screen, params) {
    var prev = this.top();
    if (prev) prev.el.classList.remove('active');
    this.stack.push(screen);
    screen.el.classList.add('active');
    if (screen.enter) screen.enter(params);
    this.refresh();
  },
  pop: function () {
    var screen = this.stack.pop();
    if (screen) screen.el.classList.remove('active');
    var top = this.top();
    if (top) {
      top.el.classList.add('active');
      if (top.resume) top.resume();
    }
    this.refresh();
  },
  top: function () { return this.stack[this.stack.length - 1] || null; },
  refresh: function () {
    var top = this.top();
    var onHome = top === homeScreen;
    document.body.classList.toggle('on-home', onHome);
    document.body.classList.toggle('in-section', !onHome);
    document.body.dataset.screen = top ? top.el.id.replace('screen-', '') : '';
  },
  handle: function (action) {
    var top = this.top();
    if (top && top.onInput) top.onInput(action);
  }
};

function makeScreen(id, build) {
  var container = document.getElementById('screens');
  var root = el('section', 'screen');
  root.id = 'screen-' + id;
  container.appendChild(root);
  var screen = { el: root };
  build(screen, root);
  return screen;
}

      svg: HEROES[m.id],

      }, 700);
    }
    if (animate) {
      hero.classList.remove('swap');
      void hero.offsetWidth; // genstart animationen
      hero.classList.add('swap');
    }
  }
  syncHero(false);

  function openTarget(target) {
    if (target === 'photos') Screens.push(photosScreen);
    else if (target === 'videos') Screens.push(videosScreen);
    else if (target === 'steam') Screens.push(steamScreen);
    else if (target === 'retro') Screens.push(retroScreen);
    else if (target === 'settings') Screens.push(settingsScreen);
  }

  cards.forEach(function (card) {
    tapToFocus(focus, card, function () { openTarget(card.dataset.target); }, function () { syncHero(true); });
  });

  screen.enter = function () { focus.applyFocus(false); syncHero(false); };
  screen.resume = function () { syncHero(false); };
  screen.onInput = function (action) {
    if (action === 'left' || action === 'up') { if (focus.move('left')) syncHero(true); }
    else if (action === 'right' || action === 'down') { if (focus.move('right')) syncHero(true); }
    else if (action === 'a') {
      openTarget(focus.current && focus.current.dataset.target);
    }
  };
});

function conceptToast() {

function makeSection(id, title, subtitle, cols, buildTiles, onFocusChange) {
  return makeScreen(id, function (screen, root) {
    root.appendChild(el('h2', 'screen-title', title));
    root.appendChild(el('p', 'screen-subtitle', subtitle));
    var area = el('div', 'scroll-area');
    root.appendChild(area);
    var grid = el('div', cols === 1 ? 'rows' : 'grid');
    if (cols > 1) grid.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
    area.appendChild(grid);

    var focus = new Grid(cols);
    var tiles = buildTiles(grid);
    focus.setItems(tiles);

    function focusChanged() {
      if (onFocusChange) onFocusChange(focus.index);
      else Ambient.show(id, { svg: HEROES[id] });
    }

    tiles.forEach(function (tile) {
      tapToFocus(focus, tile, conceptToast, focusChanged);
    });

    screen.enter = function () { focus.index = 0; focus.applyFocus(false); focusChanged(); };
    screen.onInput = function (action) {
      if (['up', 'down', 'left', 'right'].indexOf(action) !== -1) {
        if (focus.move(action)) focusChanged();
      }
      else if (action === 'a') conceptToast();
      else if (action === 'b') Screens.pop();
    };
  });
}

  root.appendChild(hero);

  var rail = el('div', 'rail vrail');
  root.appendChild(rail);

  var focus = new Grid(VIDEOS.length);
  var previewTimer = null;

  var tiles = VIDEOS.map(function (item, i) {
    var tile = el('div', 'tile media-tile');
    var ph = el('div', 'ph', item.scene.emoji);
    ph.style.background = item.scene.bg;
    tile.appendChild(ph);

    var thumb = el('img', 'thumb');
    thumb.alt = '';
    thumb.loading = 'lazy';
    thumb.addEventListener('error', function () { thumb.remove(); });
    thumb.src = item.poster;
    tile.appendChild(thumb);

    tile.appendChild(el('div', 'duration', item.durText));
    tile.appendChild(el('div', 'caption', item.name));
    rail.appendChild(tile);
    return tile;
  });
  focus.setItems(tiles);

  function syncHero() {
    var item = VIDEOS[focus.index];
    vTitle.textContent = item.name;
    vMeta.textContent = (focus.index + 1) + ' / ' + VIDEOS.length +
      (item.durText ? ' · ' + item.durText : '') + ' · sample-video (demo)';
  }

  // Kort dvale foer preview starter, saa hurtig scrolling ikke spilder baandbredde
  function focusChanged() {
    syncHero();
    clearTimeout(previewTimer);
    var i = focus.index;
    previewTimer = setTimeout(function () {
      Ambient.show('videos:' + i, {
        svg: sceneSvg(VIDEOS[i].scene, 'v' + i),
        video: VIDEOS[i].url
      });
    }, 450);
  }

  tiles.forEach(function (tile) {
    tapToFocus(focus, tile, conceptToast, focusChanged);
  });

  screen.enter = function () {
    focus.index = 0;
    focus.applyFocus(false);
    focusChanged();
  };
  screen.onInput = function (action) {
    if (action === 'left' || action === 'up') { if (focus.move('left')) focusChanged(); }
    else if (action === 'right' || action === 'down') { if (focus.move('right')) focusChanged(); }
    else if (action === 'a') conceptToast();
    else if (action === 'b') {
      clearTimeout(previewTimer);
      Screens.pop();
    }
  };
});

// ============================================================================
// Input: Gamepad API + tastatur
// ============================================================================

var Input = (function () {
  var listeners = [];
  var REPEAT_DELAY = 420, REPEAT_RATE = 130, STICK_THRESHOLD = 0.55;
  var DIRECTIONAL = { up: 1, down: 1, left: 1, right: 1 };
  var BUTTON_MAP = { 0: 'a', 1: 'b', 12: 'up', 13: 'down', 14: 'left', 15: 'right' };
  var held = {};

  function emit(action) { listeners.forEach(function (fn) { fn(action); }); }

  function activeActions() {
    var actions = {};
    var pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (var p = 0; p < pads.length; p++) {
      var pad = pads[p];
      if (!pad) continue;
      for (var i = 0; i < pad.buttons.length; i++) {
        if (pad.buttons[i].pressed && BUTTON_MAP[i]) actions[BUTTON_MAP[i]] = 1;
      }
      if (pad.axes.length >= 2) {
        if (pad.axes[0] < -STICK_THRESHOLD) actions.left = 1;
        if (pad.axes[0] > STICK_THRESHOLD) actions.right = 1;
        if (pad.axes[1] < -STICK_THRESHOLD) actions.up = 1;
        if (pad.axes[1] > STICK_THRESHOLD) actions.down = 1;
      }
    }
    return actions;
  }

  function tick() {
    var now = performance.now();
    var actions = activeActions();
    Object.keys(held).forEach(function (a) { if (!actions[a]) delete held[a]; });
    Object.keys(actions).forEach(function (action) {
      var h = held[action];
      if (!h) {
        held[action] = { since: now, lastRepeat: now };
        emit(action);
      } else if (DIRECTIONAL[action] && now - h.since >= REPEAT_DELAY && now - h.lastRepeat >= REPEAT_RATE) {
        h.lastRepeat = now;
        emit(action);
      }
    });
    requestAnimationFrame(tick);
  }

  var KEY_MAP = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    Enter: 'a', Escape: 'b', Backspace: 'b'
  };
  window.addEventListener('keydown', function (ev) {
    var action = KEY_MAP[ev.key];
    if (action) { ev.preventDefault(); emit(action); }
  });

  requestAnimationFrame(tick);
  return { on: function (fn) { listeners.push(fn); } };
})();
