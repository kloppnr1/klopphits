<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="KloppHits koncept-UI: controller-styret big screen-oplevelse til videoklip, Steam og retro-spil.">
<title>KloppHits – Koncept-UI</title>
</head>
<body>
<style>
  /* KloppHits koncept-UI — tvOS-inspireret fuldskaermsnavigation.
     Hver sektion fylder hele skaermen med et stemningsfuldt hero-baggrunds-
     billede der crossfader ved fokusskift. I den rigtige app er baggrundene
     dine egne billeder, videostills og Steam-covers.
     Identitet: biograf-sort, frosted glas, hvid typografi - farverne
     kommer fra indholdet. Fokus vises med loeft og lys, ikke ringe.
     1rem skalerer med skaermen, saa alt ser ens ud paa 1080p og 4K. */

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #050507;
    --glass: rgba(255, 255, 255, 0.07);
    --glass-strong: rgba(255, 255, 255, 0.12);
    --line: rgba(255, 255, 255, 0.14);
    --text: #f5f5f7;
    --text-dim: rgba(235, 235, 245, 0.62);
    --radius: 1.2rem;
    --safe-x: 5vw;
    --safe-y: 2.5vh;
    color-scheme: dark;
  }

  html {
    font-size: min(calc(100vh / 67.5), calc(100vw / 52));
    font-size: min(calc(100dvh / 67.5), calc(100vw / 52));
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: radial-gradient(90vw 65vh at 50% -15%, #101014 0%, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", "Helvetica Neue", sans-serif;
    user-select: none;
  }

  /* ---- Fuldskaerms hero-baggrund ---- */

  #ambient { position: fixed; inset: -3vw; z-index: 0; pointer-events: none; }
  #ambient .amb-layer {
    position: absolute; inset: 0;
    opacity: 0;
    transition: opacity 1.1s ease;
    animation: slowZoom 36s ease-in-out infinite alternate;
  }
  #ambient .amb-layer.visible { opacity: 1; }
  #ambient .amb-layer svg { width: 100%; height: 100%; display: block; }
  #ambient .amb-layer .hero-img {
    position: absolute; inset: 0;
    z-index: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  /* Art-visning til portraet-covers: hele vaerket centreret med skygge,
     baggrunden fyldes af en sloeret kopi af coveret selv */
  #ambient .amb-layer .art-bg {
    position: absolute; inset: -6%;
    z-index: 0;
    width: 112%; height: 112%;
    object-fit: cover;
    filter: blur(42px) brightness(0.4) saturate(1.15);
  }
  /* Ambient-laget er 3vw stoerre end skaermen (Ken Burns) - kompenser,
     saa coveret faar 5vh luft over og 9vh under i skaerm-koordinater */
  #ambient .amb-layer .art-fg {
    position: absolute;
    z-index: 1;
    top: calc(3vw + 5vh);
    left: 3vw;
    width: calc(100% - 6vw);
    height: calc(100% - 6vw - 14vh);
    object-fit: contain;
    filter: drop-shadow(0 1.5rem 3.5rem rgba(0, 0, 0, 0.7));
  }
  #ambient .amb-layer video.hero-video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.8s ease;
    z-index: 2; /* altid over covers - de appendes asynkront efter videoen */
  }
  #ambient .amb-layer video.hero-video.on { opacity: 1; }
  /* Pixel-perfekt C64-rendering (testens vinder, tilstand 4):
     videoen tegnes paa canvas og opskaleres uden udjaevning */
  #ambient .amb-layer canvas.hero-canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    image-rendering: pixelated;
    opacity: 0;
    transition: opacity 0.8s ease;
    z-index: 2;
  }
  #ambient .amb-layer canvas.hero-canvas.on { opacity: 1; }
  #ambient .amb-layer video.pixel-src { opacity: 0 !important; }
  /* Steam-katalog: vaeg af spil-covers som paa Steams egen biblioteksside */
  .cover-wall {
    position: absolute; inset: -7%;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 1.3rem;
    align-content: center;
    padding: 2rem 3rem;
    background: #08080b;
    transform: rotate(-3deg);
  }
  .cover-wall .cw {
    position: relative;
    aspect-ratio: 2 / 3;
    border-radius: 0.6rem;
    overflow: hidden;
    background: rgba(255, 255, 255, 0.06);
    box-shadow: 0 0.8rem 2rem rgba(0, 0, 0, 0.5);
  }
  .cover-wall .cw span {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 3rem; font-weight: 700; color: rgba(255, 255, 255, 0.35);
  }
  .cover-wall .cw img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  .cover-wall .cw img.on { opacity: 1; }
  .cover-wall .cw svg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
  }
  .cover-wall.retro-wall { background: #0a0612; }
  @keyframes slowZoom {
    from { transform: scale(1); }
    to { transform: scale(1.07); }
  }
  #ambient .amb-vignette {
    position: absolute; inset: 0;
    background: linear-gradient(rgba(5, 5, 7, 0.1) 0%, rgba(5, 5, 7, 0.35) 55%, var(--bg) 97%);
  }
  #ambient .amb-dim {
    position: absolute; inset: 0;
    background: rgba(5, 5, 7, 0.64);
    opacity: 0;
    transition: opacity 0.45s ease;
  }
  body.in-section #ambient .amb-dim { opacity: 1; }
  /* Hvor forhaandsvisningen er stjernen: naesten ingen daempning */
  body[data-screen="videos"] #ambient .amb-dim,
  body[data-screen="retro"] #ambient .amb-dim { opacity: 0.22; }

  #app {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh;
    transition: opacity 0.7s ease;
  }
  /* Biograf: mens en preview spiller, traeder alt UI tilbage */
  body.cinema #app { opacity: 0; }

  .icon-wrap { display: inline-flex; flex: 0 0 auto; }

  /* ---- Topbar ---- */

  #topbar {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: var(--safe-y) var(--safe-x) 0;
    flex: 0 0 auto;
  }
  #logo { font-size: 1.9rem; font-weight: 700; letter-spacing: 0.02em; }
  #logo span { color: var(--text-dim); }

  /* ---- Skaerme ---- */

  #screens { flex: 1 1 auto; position: relative; overflow: hidden; }
  .screen {
    position: absolute; inset: 0;
    display: none; flex-direction: column;
    padding: 0 var(--safe-x) 1rem;
    overflow: hidden;
  }
  .screen.active { display: flex; animation: screenIn 0.3s ease both; }
  @keyframes screenIn {
    from { opacity: 0; transform: translateY(0.8rem); }
    to { opacity: 1; transform: none; }
  }

  /* ---- Hjem: fuldskaerms hero + tvOS-hylde ---- */

  #screen-home { justify-content: flex-end; gap: 2.6rem; padding-bottom: 2.4rem; }

  .hero { display: flex; flex-direction: column; gap: 0.9rem; }
  .hero .hero-title {
    font-size: 6.2rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.02;
    text-wrap: balance;
  }
  .hero .hero-desc {
    font-size: 1.5rem;
    font-weight: 400;
    color: var(--text-dim);
    max-width: 46ch;
    line-height: 1.5;
  }
  .hero.swap .hero-title, .hero.swap .hero-desc {
    animation: heroIn 0.45s cubic-bezier(0.22, 0.61, 0.36, 1) both;
  }
  .hero.swap .hero-desc { animation-delay: 0.06s; }
  @keyframes heroIn {
    from { opacity: 0; transform: translateY(1rem); }
    to { opacity: 1; transform: none; }
  }

  /* tvOS-hylde: brede app-kort der loefter sig ved fokus - ingen ringe */
  .rail {
    display: flex; gap: 1.5rem; align-items: flex-start;
    overflow-x: auto; scrollbar-width: none;
    padding: 1.4rem 0.6rem 1.8rem;
  }
  .rail::-webkit-scrollbar { display: none; }

  .nav-item {
    flex: 0 0 auto;
    display: flex; flex-direction: column; align-items: center; gap: 0.85rem;
  }

  /* Frosted glas-kort: laaner altid farven fra hero-baggrunden bagved,
     saa navigation og baggrund pr. definition haenger sammen */
  .app-card {
    position: relative;
    width: 17rem;
    aspect-ratio: 16 / 9;
    border-radius: 0.9rem;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255, 255, 255, 0.07);
    backdrop-filter: blur(18px);
    box-shadow: 0 0.4rem 1.2rem rgba(0, 0, 0, 0.35), inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    transition: transform 0.28s cubic-bezier(0.2, 0.7, 0.3, 1), background-color 0.28s ease, box-shadow 0.28s ease;
  }
  .app-card .icon-wrap svg {
    width: 3.6rem; height: 3.6rem;
    color: var(--text);
    opacity: 0.7;
    transition: opacity 0.25s ease;
  }
  /* tvOS-sheen: lysstrejf hen over det fokuserede kort */
  .app-card::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(115deg, transparent 32%, rgba(255, 255, 255, 0.22) 48%, transparent 64%);
    background-size: 250% 100%;
    background-position: 150% 0;
    opacity: 0;
    pointer-events: none;
  }
  .nav-item.focused .app-card {
    background: rgba(255, 255, 255, 0.15);
    box-shadow: 0 1.8rem 3.5rem rgba(0, 0, 0, 0.65), inset 0 0 0 1px rgba(255, 255, 255, 0.16);
    z-index: 3;
    animation: cardFloat 4.5s ease-in-out 0.3s infinite alternate;
  }
  .nav-item.focused .app-card .icon-wrap svg { opacity: 1; }
  @keyframes cardFloat {
    from { transform: scale(1.12) translateY(-0.45rem); }
    to { transform: scale(1.12) translateY(-0.85rem); }
  }
  .nav-item.focused .app-card::after {
    opacity: 1;
    animation: cardSheen 1.1s ease 0.05s 1 both;
  }
  @keyframes cardSheen {
    from { background-position: 150% 0; }
    to { background-position: -60% 0; }
  }

  .app-label {
    font-size: 1.25rem;
    font-weight: 600;
    color: var(--text-dim);
    opacity: 0.75;
    transition: color 0.25s ease, opacity 0.25s ease;
  }
  .nav-item.focused .app-label { color: var(--text); opacity: 1; }

  /* ---- Sektionssider (indhold over hero-baggrunden) ---- */

  .screen-title { font-size: 2.8rem; font-weight: 700; letter-spacing: -0.015em; margin: 0.6rem 0 0.2rem; text-wrap: balance; }
  .screen-subtitle { font-size: 1.3rem; font-weight: 400; color: var(--text-dim); margin-bottom: 0.9rem; }
  .scroll-area { flex: 1 1 auto; overflow-y: auto; scrollbar-width: none; padding: 1.3rem 0.5rem 3rem; }
  .scroll-area::-webkit-scrollbar { display: none; }

  .grid { display: grid; gap: 2rem; }

  /* Fliser i tvOS-stil: glas, loeft og lys - ingen fokusringe */
  .tile {
    position: relative;
    border-radius: var(--radius);
    background: var(--glass);
    backdrop-filter: blur(14px);
    overflow: hidden;
    filter: brightness(0.85);
    box-shadow: 0 0.4rem 1.2rem rgba(0, 0, 0, 0.4);
    transition: transform 0.25s cubic-bezier(0.2, 0.7, 0.3, 1), filter 0.25s ease, box-shadow 0.25s ease;
  }
  .tile.focused {
    transform: scale(1.08);
    filter: brightness(1.05);
    box-shadow: 0 1.4rem 3rem rgba(0, 0, 0, 0.7), 0 0 0 0.14rem rgba(255, 255, 255, 0.35);
    z-index: 2;
  }

  .tile.media-tile { aspect-ratio: 16 / 10; }
  .tile.media-tile .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 3.6rem; }
  .tile.media-tile .thumb {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }

  /* ---- Videoklip: fuldskaerms live-preview, fliser som diskret raekke ---- */

  #screen-videos, #screen-retro { justify-content: flex-end; gap: 1.4rem; padding-bottom: 1.6rem; }
  .vhero { display: flex; flex-direction: column; gap: 0.4rem; }
  .vhero .vhero-title { font-size: 3.8rem; font-weight: 700; letter-spacing: -0.015em; line-height: 1.05; }
  .vhero .vhero-meta { font-size: 1.3rem; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .vrail .tile.media-tile { flex: 0 0 auto; width: 15rem; }
  /* Retro-railen bruger 2:3-kassetteformat, saa box art passer perfekt */
  .vrail.retro-rail .tile.media-tile { width: 10.5rem; aspect-ratio: 2 / 3; }
  .tile.media-tile img.thumb {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .tile .caption {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 1.8rem 0.9rem 0.65rem;
    font-size: 1.15rem; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
  }
  .tile .duration {
    position: absolute; top: 0.6rem; right: 0.6rem;
    background: rgba(5, 5, 7, 0.72);
    backdrop-filter: blur(8px);
    padding: 0.12rem 0.65rem; border-radius: 0.55rem;
    font-size: 0.95rem; font-weight: 700; font-variant-numeric: tabular-nums;
  }

  .tile.steam-tile { aspect-ratio: 2 / 3; }
  .tile.steam-tile img.cover {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .tile.steam-tile .fallback {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1rem; padding: 1.2rem; text-align: center;
  }
  .tile.steam-tile .big-letter { font-size: 4rem; font-weight: 700; color: var(--text); }
  .tile.steam-tile .name { font-size: 1.25rem; font-weight: 600; color: var(--text-dim); }

  .tile .caption .cap-sub {
    display: block;
    font-size: 0.98rem;
    font-weight: 400;
    color: var(--text-dim);
    margin-top: 0.2rem;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ---- Toast ---- */

  #toast {
    position: fixed; top: calc(var(--safe-y) + 0.8rem); left: 50%; transform: translateX(-50%);
    background: rgba(20, 20, 24, 0.85);
    backdrop-filter: blur(16px);
    border: 1px solid var(--line);
    padding: 0.9rem 2.2rem; border-radius: 999px;
    font-size: 1.3rem; font-weight: 600; z-index: 60;
    transition: opacity 0.25s ease;
    max-width: 80vw; text-align: center;
  }
  .hidden { opacity: 0; pointer-events: none; }

  /* ---- Mobil/portraet: forhaandsvisning af TV-konceptet ---- */

  @media (orientation: portrait) {
    .grid { grid-template-columns: repeat(2, 1fr) !important; }
    .hero .hero-title { font-size: 4rem; }
    .app-card { width: 12rem; }
    #screen-home { padding-bottom: 1.4rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .tile, .app-card, #ambient .amb-layer, #ambient .amb-dim { transition: none; animation: none; }
    .screen.active, .hero.swap .hero-title, .hero.swap .hero-desc,
    .nav-item.focused .app-card, .nav-item.focused .app-card::after { animation: none; }
    .nav-item.focused .app-card { transform: scale(1.1); }
  }
</style>

<div id="ambient"></div>
<div id="app">
  <header id="topbar">
    <div id="logo">klopp<span>hits</span></div>
  </header>
  <main id="screens"></main>
  <div id="toast" class="hidden"></div>
</div>

<script>
'use strict';

// ============================================================================
// Ikoner (rene stregikoner, farves med currentColor)
// ============================================================================

var STROKE = 'fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"';

var ICONS = {
  videos: '<svg viewBox="0 0 24 24" ' + STROKE + '><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 9.5h3.5M3 14.5h3.5M17.5 9.5H21M17.5 14.5H21M6.5 5v14M17.5 5v14"/><path d="M10.6 9.8v4.4l3.8-2.2z" fill="currentColor" stroke="none"/></svg>',
  steam: '<svg viewBox="0 0 24 24" ' + STROKE + '><path d="M6.8 7.5h10.4a4.8 4.8 0 0 1 4.77 5.3c-.2 1.9-1.7 3.7-3.67 3.7-1.11 0-2.16-.53-2.83-1.42L14.3 13.6H9.7l-1.17 1.48c-.67.89-1.72 1.42-2.83 1.42-1.97 0-3.47-1.8-3.67-3.7A4.8 4.8 0 0 1 6.8 7.5z"/><path d="M8.2 10.4v3M6.7 11.9h3"/><circle cx="15.3" cy="11" r="0.9" fill="currentColor" stroke="none"/><circle cx="17.6" cy="12.9" r="0.9" fill="currentColor" stroke="none"/></svg>',
  retro: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 4h2v2H5zM17 4h2v2h-2zM7 6h2v2H7zM15 6h2v2h-2zM5 8h14v2H5zM3 10h4v2H3zM9 10h6v2H9zM17 10h4v2h-4zM1 12h22v2H1zM1 14h2v2H1zM5 14h14v2H5zM21 14h2v2h-2zM1 16h2v2H1zM5 16h2v2H5zM17 16h2v2h-2zM21 16h2v2h-2zM7 18h4v2H7zM13 18h4v2h-4z"/></svg>',
};

// ============================================================================
// Hjaelpere
// ============================================================================

function el(tag, className, text) {
  var node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function icon(name) {
  var wrap = el('span', 'icon-wrap');
  wrap.innerHTML = ICONS[name];
  return wrap;
}

var toastTimer = null;
function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.add('hidden'); }, 2400);
}

function scene(hue1, hue2, emoji) {
  return {
    bg: 'linear-gradient(150deg, hsl(' + hue1 + ' 28% 34%) 0%, hsl(' + hue2 + ' 32% 14%) 85%)',
    h1: hue1,
    h2: hue2,
    emoji: emoji
  };
}

// ============================================================================
// Hero-scener pr. sektion (i den rigtige app: dine billeder & Steam-covers)
// ============================================================================

// Haandbyggede SVG-scener, 1920x1080, beskaeres med "slice" som et foto.

var SVG_OPEN = '<svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">';

function stars(seedX, count, yMax, color) {
  var out = '';
  for (var i = 0; i < count; i++) {
    var x = ((seedX + i * 379) % 1900) + 10;
    var y = ((i * 233 + seedX * 7) % yMax) + 20;
    var r = 1 + (i % 3);
    var o = 0.35 + ((i * 17) % 50) / 100;
    out += '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + color + '" opacity="' + o + '"/>';
  }
  return out;
}

// Fuldskaerms-scene for et enkelt element (i den rigtige app: selve billedet)
function sceneSvg(s, uid) {
  return SVG_OPEN +
    '<defs><linearGradient id="sc-' + uid + '" x1="0" y1="0" x2="1" y2="1">' +
    '<stop offset="0" stop-color="hsl(' + s.h1 + ' 30% 36%)"/>' +
    '<stop offset="1" stop-color="hsl(' + s.h2 + ' 34% 12%)"/></linearGradient>' +
    '<radialGradient id="scg-' + uid + '"><stop offset="0" stop-color="hsl(' + s.h1 + ' 60% 70%)" stop-opacity="0.32"/><stop offset="1" stop-color="hsl(' + s.h1 + ' 60% 70%)" stop-opacity="0"/></radialGradient></defs>' +
    '<rect width="1920" height="1080" fill="url(#sc-' + uid + ')"/>' +
    '<ellipse cx="1250" cy="420" rx="720" ry="440" fill="url(#scg-' + uid + ')"/>' +
    '<text x="960" y="710" font-size="430" text-anchor="middle" opacity="0.3">' + s.emoji + '</text>' +
    '</svg>';
}

var HEROES = {

  // Blaa time: maane over havet
  videos: SVG_OPEN +
    '<defs>' +
    '<linearGradient id="vi-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1120"/><stop offset="0.75" stop-color="#1d3a55"/></linearGradient>' +
    '<radialGradient id="vi-mglow"><stop offset="0" stop-color="#dcecf8" stop-opacity="0.9"/><stop offset="0.25" stop-color="#bcd8ee" stop-opacity="0.4"/><stop offset="1" stop-color="#bcd8ee" stop-opacity="0"/></radialGradient>' +
    '<linearGradient id="vi-sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#25506e"/><stop offset="1" stop-color="#0b0f15"/></linearGradient>' +
    '</defs>' +
    '<rect width="1920" height="770" fill="url(#vi-sky)"/>' +
    stars(101, 40, 500, '#cfe3f2') +
    '<circle cx="560" cy="290" r="230" fill="url(#vi-mglow)"/>' +
    '<circle cx="560" cy="290" r="80" fill="none" stroke="#e8f2fa" stroke-width="6" opacity="0.92"/>' +
    '<path d="M540 256 L606 290 L540 324 Z" fill="#e8f2fa" opacity="0.95"/>' +
    '<ellipse cx="300" cy="470" rx="260" ry="34" fill="#23415c" opacity="0.55"/>' +
    '<ellipse cx="820" cy="520" rx="340" ry="30" fill="#1d3750" opacity="0.6"/>' +
    '<ellipse cx="1520" cy="430" rx="300" ry="36" fill="#23415c" opacity="0.5"/>' +
    '<rect y="770" width="1920" height="310" fill="url(#vi-sea)"/>' +

var Ambient = (function () {
  var root = document.getElementById('ambient');
  var layers = [el('div', 'amb-layer'), el('div', 'amb-layer')];
  layers.forEach(function (l) { root.appendChild(l); });
  root.appendChild(el('div', 'amb-vignette'));
  root.appendChild(el('div', 'amb-dim'));
  var active = 0;
  var currentKey = null;

  function stopVideo(layer) {
    var v = layer.querySelector('video');
    if (v) {
      v.pause();
      v.removeAttribute('src');
      v.load();
    }
  }

  function currentVideo() {
    return layers[active].querySelector('video');
  }

  // Stop en igangvaerende preview og fald tilbage til stillbilledet
  function stopPreview() {
    var lay = layers[active];
    var v = lay.querySelector('video');
    if (!v) return false;
    var pc = lay.querySelector('canvas.hero-canvas');
    document.body.classList.remove('cinema');
    v.classList.remove('on');
    if (pc) pc.classList.remove('on');
    setTimeout(function () {
      v.remove();
      if (pc) pc.remove();
    }, 900);
    return true;
  }

  function isPreviewing() {
    var v = currentVideo();
    return !!(v && v.classList.contains('on'));
  }

  // spec: { svg: SVG-fallback, node: DOM-element (fx cover-katalog),
  //         img: billed-URL, video: video-URL til live-preview }
  // force: vis igen selv om noeglen er uaendret (bruges til A = afspil igen)
  function show(key, spec, force) {
    if ((key === currentKey && !force) || !spec) return;
    currentKey = key;
    document.body.classList.remove('cinema');
    active = 1 - active;
    var layer = layers[active];
    stopVideo(layer);
    layer.innerHTML = spec.svg || '';
    if (spec.node) layer.appendChild(spec.node);
    if (spec.img) {
      var im = new Image();
      im.alt = '';
      if (spec.imgArt) {
        // Portraet-cover: sloeret kopi som baggrund, hele vaerket i front
        im.className = 'art-bg';
        var fg = new Image();
        fg.className = 'art-fg';
        fg.alt = '';
        im.onload = function () {
          if (currentKey !== key) return;
          fg.src = spec.img;
          layer.appendChild(im);
          layer.appendChild(fg);
        };
      } else {
        im.className = 'hero-img';
        im.onload = function () {
          if (currentKey === key) layer.appendChild(im);
        };
      }
      im.src = spec.img; // ved fejl beholdes SVG-scenen
    }
    if (spec.video) {
      var v = document.createElement('video');
      v.className = 'hero-video';
      v.muted = true;
      v.autoplay = true;
      v.playsInline = true;
      // iOS/Safari kraever attributterne (ikke kun egenskaberne) for autoplay
      v.setAttribute('muted', '');
      v.setAttribute('autoplay', '');
      v.setAttribute('playsinline', '');

      // Pixel-perfekt rendering: video skjules, tegnes paa canvas i stedet
      var pc = null, pctx = null;
      if (spec.pixelated) {
        v.classList.add('pixel-src');
        pc = document.createElement('canvas');
        pc.className = 'hero-canvas';
        pctx = pc.getContext('2d');
      }

      v.addEventListener('playing', function () {
        v.classList.add('on');
        if (pc) pc.classList.add('on');
        document.body.classList.add('cinema');
      });
      // Afspil een gang (eller til preview-loftet) og fald roligt tilbage
      function endPreview() {
        document.body.classList.remove('cinema');
        v.classList.remove('on');
        if (pc) pc.classList.remove('on');
        setTimeout(function () {
          v.remove();
          if (pc) pc.remove();
        }, 900);
      }
      v.addEventListener('ended', endPreview);
      if (spec.videoMax) {
        var startAt = spec.videoStart || 0;
        v.addEventListener('timeupdate', function () {
          if (v.currentTime - startAt >= spec.videoMax) endPreview();
        });
      }
      // Kandidat-kaede: proev naeste URL ved fejl (mediefiler kraever ingen CORS)
      var srcs = Array.isArray(spec.video) ? spec.video.slice() : [spec.video];
      var si = 0;
      function setSrc() {
        v.src = spec.videoStart ? srcs[si] + '#t=' + spec.videoStart : srcs[si];
        if (v.play) v.play().catch(function () {});
      }
      v.addEventListener('error', function () {
        si++;
        if (si < srcs.length) {
          setSrc();
          return;
        }
        document.body.classList.remove('cinema');
        v.remove();
        if (pc) pc.remove();
        if (spec.onVideoFail) spec.onVideoFail();
      }); // stillbilledet bliver staaende
      setSrc();
      layer.appendChild(v);
      if (pc) {
        layer.appendChild(pc);
        (function loop() {
          if (!v.isConnected) return;
          if (v.videoWidth) {
            if (pc.width !== v.videoWidth) {
              pc.width = v.videoWidth;
              pc.height = v.videoHeight;
            }
            pctx.drawImage(v, 0, 0);
          }
          requestAnimationFrame(loop);
        })();
      }
    }
    layer.classList.add('visible');
    var hidden = layers[1 - active];
    hidden.classList.remove('visible');
    // Stop skjult video naar crossfaden er faerdig (spar baandbredde/batteri)
    setTimeout(function () {
      if (!hidden.classList.contains('visible')) stopVideo(hidden);
    }, 1400);
  }
  return { show: show, stopPreview: stopPreview, isPreviewing: isPreviewing };
})();

// Archive.org (World of Longplays / MadMatty). Streames direkte;
// previews starter et stykke inde og stopper efter 15 sekunder.
// Slaar det praecise MP4-filnavn op i et archive.org-arkiv ved runtime
// (metadata-API'et er CORS-aabent). Ingen gaettede filnavne.
var iaMetaCache = {};
function resolveArchiveMp4(item, match) {
  if (!iaMetaCache[item]) {
    iaMetaCache[item] = fetch('https://archive.org/metadata/' + item)
      .then(function (r) { return r.json(); });
  }
  return iaMetaCache[item].then(function (meta) {
    var files = (meta.files || []).filter(function (f) {
      return /\.mp4$/i.test(f.name) && (!match || match.test(f.name));
    });
    if (!files.length) return null;
    // Foretraek den mindste fil (typisk web-afledningen)
    files.sort(function (a, b) { return (+a.size || 9e12) - (+b.size || 9e12); });
    return 'https://archive.org/download/' + item + '/' +
      encodeURIComponent(files[0].name).replace(/%2F/g, '/');
  }).catch(function () { return null; });
}

].map(function (g) {

// ============================================================================
// Fokus-gitter
// ============================================================================

function Grid(cols) {
  this.cols = cols;
  this.items = [];
  this.index = 0;
}
Grid.prototype.setItems = function (elements) {
  this.items = elements;
  this.index = Math.min(this.index, Math.max(0, elements.length - 1));
  this.applyFocus(false);
};
Grid.prototype.applyFocus = function (scroll) {
  var idx = this.index;
  this.items.forEach(function (item, i) { item.classList.toggle('focused', i === idx); });
  var cur = this.items[idx];
  if (cur && scroll !== false) cur.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
};
Grid.prototype.move = function (dir) {
  if (!this.items.length) return false;
  var i = this.index;
  if (dir === 'left') i -= 1;
  else if (dir === 'right') i += 1;
  else if (dir === 'up') i -= this.cols;
  else if (dir === 'down') i += this.cols;
  else return false;
  if (dir === 'down' && i >= this.items.length) {
    var lastRowStart = Math.floor((this.items.length - 1) / this.cols) * this.cols;
    if (this.index < lastRowStart) i = this.items.length - 1; else return false;
  }
  if (i < 0 || i >= this.items.length || i === this.index) return false;
  this.index = i;
  this.applyFocus();
  return true;
};
Object.defineProperty(Grid.prototype, 'current', {
  get: function () { return this.items[this.index] || null; }
});

// Touch: foerste tryk fokuserer, andet tryk aabner
function tapToFocus(focus, element, activate, onFocus) {
  element.addEventListener('click', function () {
    if (focus.current === element) {
      activate();
    } else {
      var i = focus.items.indexOf(element);
      if (i !== -1) {
        focus.index = i;
        focus.applyFocus();
        if (onFocus) onFocus();
      }
    }
  });
}

// ============================================================================
// Skaerm-stak
// ============================================================================

var Screens = {
  stack: [],
  push: function (screen, params) {
    var prev = this.top();
    if (prev) prev.el.classList.remove('active');
    this.stack.push(screen);
    screen.el.classList.add('active');
    if (screen.enter) screen.enter(params);
    this.refresh();
  },
  pop: function () {
    var screen = this.stack.pop();
    if (screen) screen.el.classList.remove('active');
    var top = this.top();
    if (top) {
      top.el.classList.add('active');
      if (top.resume) top.resume();
    }
    this.refresh();
  },
  top: function () { return this.stack[this.stack.length - 1] || null; },
  refresh: function () {
    var top = this.top();
    var onHome = top === homeScreen;
    document.body.classList.toggle('on-home', onHome);
    document.body.classList.toggle('in-section', !onHome);
    document.body.dataset.screen = top ? top.el.id.replace('screen-', '') : '';
  },
  handle: function (action) {
    var top = this.top();
    if (top && top.onInput) top.onInput(action);
  }
};

function makeScreen(id, build) {
  var container = document.getElementById('screens');
  var root = el('section', 'screen');
  root.id = 'screen-' + id;
  container.appendChild(root);
  var screen = { el: root };
  build(screen, root);
  return screen;
}

// ============================================================================
// Hjem: fuldskaerms hero + tvOS-hylde
// ============================================================================

var MENU = [
  { id: 'videos', icon: 'videos', label: 'Videoklip', desc: 'Familiens videoklip, klar til afspilning.' },
  { id: 'steam', icon: 'steam', label: 'Steam', desc: 'Hele dit spilbibliotek, klar til start.' },
  { id: 'retro', icon: 'retro', label: 'Retro spil', desc: 'C64-klassikere med levende gameplay-previews.' }
];

var homeScreen = makeScreen('home', function (screen, root) {
  var hero = el('div', 'hero');
  var heroTitle = el('div', 'hero-title');
  var heroDesc = el('div', 'hero-desc');
  hero.appendChild(heroTitle);
  hero.appendChild(heroDesc);
  root.appendChild(hero);

  var rail = el('div', 'rail');
  root.appendChild(rail);

  var focus = new Grid(MENU.length);
  var cards = MENU.map(function (m) {
    var item = el('div', 'nav-item');
    item.dataset.target = m.id;
    var card = el('div', 'app-card');
    card.appendChild(icon(m.icon));
    item.appendChild(card);
    item.appendChild(el('div', 'app-label', m.label));
    rail.appendChild(item);
    return item;
  });
  focus.setItems(cards);

  function syncHero(animate) {
    var m = MENU[focus.index];
    heroTitle.textContent = m.label;
    heroDesc.textContent = m.desc;
    // Hjemmeskaermen er rolig: kun statiske heroes - previews koerer i sektionerne
    Ambient.show(m.id, {
      svg: HEROES[m.id],
      node: m.id === 'steam' ? makeCoverWall() : (m.id === 'retro' ? makeRetroWall() : undefined)
    });
    if (animate) {
      hero.classList.remove('swap');
      void hero.offsetWidth; // genstart animationen
      hero.classList.add('swap');
    }
  }
  syncHero(false);

  function openTarget(target) {
    if (target === 'videos') Screens.push(videosScreen);
    else if (target === 'steam') Screens.push(steamScreen);
    else if (target === 'retro') Screens.push(retroScreen);
  }

  cards.forEach(function (card) {
    tapToFocus(focus, card, function () { openTarget(card.dataset.target); }, function () { syncHero(true); });
  });

  screen.enter = function () { focus.applyFocus(false); syncHero(false); };
  screen.resume = function () { syncHero(false); };
  screen.onInput = function (action) {
    if (action === 'left' || action === 'up') { if (focus.move('left')) syncHero(true); }
    else if (action === 'right' || action === 'down') { if (focus.move('right')) syncHero(true); }
    else if (action === 'a') {
      openTarget(focus.current && focus.current.dataset.target);
    }
  };
});

// ============================================================================
// Sektionssider (indhold i fuld skaerm over sektionens hero-baggrund)
// ============================================================================

function conceptToast() {
  toast('Koncept — kun stil og navigation');
}

function makeSection(id, title, subtitle, cols, buildTiles, onFocusChange) {
  return makeScreen(id, function (screen, root) {
    root.appendChild(el('h2', 'screen-title', title));
    root.appendChild(el('p', 'screen-subtitle', subtitle));
    var area = el('div', 'scroll-area');
    root.appendChild(area);
    var grid = el('div', 'grid');
    grid.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
    area.appendChild(grid);

    var focus = new Grid(cols);
    var tiles = buildTiles(grid);
    focus.setItems(tiles);

    function focusChanged() {
      if (onFocusChange) onFocusChange(focus.index);
      else Ambient.show(id, { svg: HEROES[id] });
    }

    tiles.forEach(function (tile) {
      tapToFocus(focus, tile, conceptToast, focusChanged);
    });

    screen.enter = function () { focus.index = 0; focus.applyFocus(false); focusChanged(); };
    screen.onInput = function (action) {
      if (['up', 'down', 'left', 'right'].indexOf(action) !== -1) {
        if (focus.move(action)) focusChanged();
      }
      else if (action === 'a') conceptToast();
      else if (action === 'b') Screens.pop();
    };
  });
}

  // Kort dvale foer preview starter, saa hurtig scrolling ikke spilder baandbredde

  // A: stop en koerende preview, eller start den fokuserede med det samme

  tiles.forEach(function (tile) {

  screen.enter = function () {
    focus.index = 0;

    focusChanged();
  };
  screen.onInput = function (action) {
    if (action === 'left' || action === 'up') { if (focus.move('left')) focusChanged(); }
    else if (action === 'right' || action === 'down') { if (focus.move('right')) focusChanged(); }
    else if (action === 'a') pressA();
    else if (action === 'b') {
      clearTimeout(previewTimer);
      Screens.pop();
    }

// Retro spil: samme interaktion som Videoklip - een raekke, venstre/hoejre,
// A starter/stopper preview. Fliserne viser aegte gameplay-stills fra
// longplay-videoerne (frame fra preview-startpunktet).
var retroScreen = makeScreen('retro', function (screen, root) {
  var hero = el('div', 'vhero');
  var rTitle = el('div', 'vhero-title');
  var rMeta = el('div', 'vhero-meta');
  hero.appendChild(rTitle);
  hero.appendChild(rMeta);
  root.appendChild(hero);

  var rail = el('div', 'rail vrail retro-rail');
  root.appendChild(rail);

  var focus = new Grid(LONGPLAYS.length);
  var previewTimer = null;

  var tiles = LONGPLAYS.map(function (g) {
    var tile = el('div', 'tile media-tile');
    var ph = el('div', 'ph', g.scene.emoji);
    ph.style.background = g.scene.bg;
    tile.appendChild(ph);

    if (g.cover) {
      // Aegte box art som flise-art
      var art = el('img', 'thumb');
      art.alt = '';
      art.loading = 'lazy';
      art.addEventListener('error', function () { art.remove(); });
      art.src = g.cover;
      tile.appendChild(art);
    } else if (g.url) {
      // Gameplay-still fra longplay-videoen
      var thumb = document.createElement('video');
      thumb.className = 'thumb';
      thumb.muted = true;
      thumb.setAttribute('muted', '');
      thumb.setAttribute('playsinline', '');
      thumb.preload = 'metadata';
      thumb.addEventListener('error', function () { thumb.remove(); });
      thumb.src = g.url + '#t=' + g.start;
      tile.appendChild(thumb);
    }

    var cap = el('div', 'caption', g.name);
    cap.appendChild(el('span', 'cap-sub', g.sub));
    tile.appendChild(cap);
    rail.appendChild(tile);
    return tile;
  });
  focus.setItems(tiles);

  function syncHero() {
    var g = LONGPLAYS[focus.index];
    rTitle.textContent = g.name;
    rMeta.textContent = g.sub + (g.url ? ' · longplay · archive.org' : ' · cover art');
  }

  function showPreview(force) {
    var i = focus.index;
    var g = LONGPLAYS[i];
    var candidates = g.urls || (g.url ? [g.url] : null);

    function play(f, urls) {
      Ambient.show('retro:' + i, {
        svg: sceneSvg(g.scene, 'r' + i),
        img: g.cover,
        imgArt: true,
        video: urls,
        videoStart: g.start,
        videoMax: 15,
        pixelated: true, // testens vinder: pixel-perfekt C64-rendering
        onVideoFail: function () {
          // Alle kandidater fejlede: slaa filnavnet op som sidste udvej
          if (g.resolved || !g.item) return;
          g.resolved = true;
          resolveArchiveMp4(g.item, g.match).then(function (url) {
            if (url && focus.index === i && document.body.dataset.screen === 'retro') {
              g.urls = [url];
              play(true, g.urls);
            }
          });
        }
      }, f);
    }

    if (candidates) {
      play(force, candidates);
    } else {
      Ambient.show('retro:' + i, { svg: sceneSvg(g.scene, 'r' + i), img: g.cover, imgArt: true }, force);
    }
  }

  function focusChanged() {
    document.body.classList.remove('cinema'); // UI straks tilbage ved navigation
    syncHero();
    clearTimeout(previewTimer);
    previewTimer = setTimeout(function () {
      if (document.body.dataset.screen === 'retro') showPreview();
    }, 450);
  }

  // A: stop en koerende preview, eller start den fokuserede med det samme
  function pressA() {
    if (Ambient.isPreviewing()) {
      Ambient.stopPreview();
    } else {
      clearTimeout(previewTimer);
      showPreview(true);
    }
  }

  tiles.forEach(function (tile) {
    tapToFocus(focus, tile, pressA, focusChanged);
  });

  screen.enter = function () {
    focus.index = 0;
    focus.applyFocus(false);
    focusChanged();
  };
  screen.onInput = function (action) {
    if (action === 'left' || action === 'up') { if (focus.move('left')) focusChanged(); }
    else if (action === 'right' || action === 'down') { if (focus.move('right')) focusChanged(); }
    else if (action === 'a') pressA();
    else if (action === 'b') {
      clearTimeout(previewTimer);
      Screens.pop();
    }
  };
});

// ============================================================================
// Input: Gamepad API + tastatur
// ============================================================================

var Input = (function () {
  var listeners = [];
  var REPEAT_DELAY = 420, REPEAT_RATE = 130, STICK_THRESHOLD = 0.55;
  var DIRECTIONAL = { up: 1, down: 1, left: 1, right: 1 };
  var BUTTON_MAP = { 0: 'a', 1: 'b', 12: 'up', 13: 'down', 14: 'left', 15: 'right' };
  var held = {};

  function emit(action) { listeners.forEach(function (fn) { fn(action); }); }

  function activeActions() {
    var actions = {};
    var pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (var p = 0; p < pads.length; p++) {
      var pad = pads[p];
      if (!pad) continue;
      for (var i = 0; i < pad.buttons.length; i++) {
        if (pad.buttons[i].pressed && BUTTON_MAP[i]) actions[BUTTON_MAP[i]] = 1;
      }
      if (pad.axes.length >= 2) {
        if (pad.axes[0] < -STICK_THRESHOLD) actions.left = 1;
        if (pad.axes[0] > STICK_THRESHOLD) actions.right = 1;
        if (pad.axes[1] < -STICK_THRESHOLD) actions.up = 1;
        if (pad.axes[1] > STICK_THRESHOLD) actions.down = 1;
      }
    }
    return actions;
  }

  function tick() {
    var now = performance.now();
    var actions = activeActions();
    Object.keys(held).forEach(function (a) { if (!actions[a]) delete held[a]; });
    Object.keys(actions).forEach(function (action) {
      var h = held[action];
      if (!h) {
        held[action] = { since: now, lastRepeat: now };
        emit(action);
      } else if (DIRECTIONAL[action] && now - h.since >= REPEAT_DELAY && now - h.lastRepeat >= REPEAT_RATE) {
        h.lastRepeat = now;
        emit(action);
      }
    });
    requestAnimationFrame(tick);
  }

  var KEY_MAP = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    Enter: 'a', Escape: 'b', Backspace: 'b'
  };
  window.addEventListener('keydown', function (ev) {
    var action = KEY_MAP[ev.key];
    if (action) { ev.preventDefault(); emit(action); }
  });

  requestAnimationFrame(tick);
  return { on: function (fn) { listeners.push(fn); } };
})();
